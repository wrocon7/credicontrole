<script>
(function(){
"use strict";
const S={clientes:[],contratos:[],transacoes:[],config:{},avisos:[],lemb:{},loaded:{}};
let db=null, canWrite=true, view="dashboard", sub={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money=v=>BRL.format(+v||0);
const r2=v=>Math.round((+v||0)*100)/100;
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>iso(new Date());
const fdate=s=>s?parse(s).toLocaleDateString("pt-BR"):"—";
const days=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const PER={mensal:"Mensal",quinzenal:"Quinzenal",semanal:"Semanal",diaria:"Diária"};
const MOD={saldo:"Saldo devedor (juros por dia)",simples:"Parcelado (juros simples)",price:"Price (juros compostos)",juros:"Só juros + principal no fim"};
const isSaldo=c=>!!c&&c.modalidade==="saldo";
// Quem está usando (no servidor próprio). Operador: vê e altera só a própria rota, lança contrato que fica aguardando
// o Pix do administrador e só registra recebimento se o administrador liberar em Configurações.
const eu=()=>window.__ccEu||{papel:"admin",nome:""};
const souAdmin=()=>eu().papel==="admin";
const rotas=()=>String(cfg("rotas")||"").split(",").map(x=>x.trim()).filter(Boolean);
const podeReceber=()=>souAdmin()||!!cfg("operadorRecebe");
const cfg=k=>{const d={nome:"CrediControle",taxa:20,multa:2,mora:0.33,saldoInicial:0,corteDias:1,msg:"Olá {nome}, tudo bem? Passando para lembrar da parcela {parcela} do seu contrato, no valor de {valor}, com vencimento em {vencimento}. Qualquer dúvida estou à disposição."};return S.config[k]??d[k]};

/* ---------- cálculo ---------- */
/* calculo:inicio — o servidor (calculo.js) usa este trecho nos lembretes do WhatsApp; aqui dentro, só r2, as funções de data, cfg e today */
function vencimento(c,k){ // k = 0-based
  const b=c.primeiroVenc;
  if(c.periodicidade==="quinzenal")return addDays(b,15*k);
  if(c.periodicidade==="semanal")return addDays(b,7*k);
  if(c.periodicidade==="diaria")return addDays(b,k);
  return addMonths(b,k);
}
// Taxa (% por período) que resulta numa parcela de valor p. Devolve null se a parcela não cobre o emprestado.
function taxaDaParcela(mod,V,n,p){
  if(!(V>0)||!(p>0))return null;
  if(mod==="juros")return p/V*100;
  if(p*n<V-0.005)return null;
  if(mod==="simples")return Math.max(0,(p*n/V-1)/n*100);
  let a=0,b=10; // Price: procura a taxa pela metade do intervalo (0% a 1000%)
  for(let k=0;k<80;k++){const m=(a+b)/2,pm=m>0?V*m/(1-Math.pow(1+m,-n)):V/n;if(pm>p)b=m;else a=m}
  return a*100;
}
function gerarParcelas(c){
  const V=+c.valor,i=(+c.taxa)/100,n=Math.max(1,parseInt(c.nParcelas)||1),out=[];
  let vals=[];
  const fixa=+c.parcelaFixa>0?r2(c.parcelaFixa):0; // valor da parcela digitado no contrato (a taxa foi calculada a partir dele)
  if(c.modalidade==="price"){const p=i>0?V*i/(1-Math.pow(1+i,-n)):V/n;vals=Array(n).fill(fixa||r2(p));}
  else if(c.modalidade==="juros"){const j=fixa||r2(V*i);vals=Array(n).fill(j);vals[n-1]=r2(j+V);}
  else if(fixa)vals=Array(n).fill(fixa);
  else{const tot=r2(V*(1+i*n)),p=r2(tot/n);vals=Array(n).fill(p);vals[n-1]=r2(tot-p*(n-1));}
  for(let k=0;k<n;k++)out.push({n:k+1,venc:vencimento(c,k),valor:vals[k],pagamentos:[]});
  return out;
}
const pagoP=p=>r2((p.pagamentos||[]).reduce((a,x)=>a+(+x.valor||0),0));
function encargos(p,c,ref){
  ref=ref||today();
  const atraso=Math.max(0,days(p.venc,ref));
  const multa=atraso>0?r2(p.valor*(+(c.multa??cfg("multa")))/100):0;
  const mora=atraso>0?r2(p.valor*(+(c.mora??cfg("mora")))/100*atraso):0;
  const total=r2(p.valor+multa+mora), pago=pagoP(p);
  return {atraso,multa,mora,total,pago,devido:Math.max(0,r2(total-pago))};
}
const quitadaP=p=>!!p.quitada;
/* saldo:inicio — modalidade "saldo devedor": juros simples por dia corrido (taxa mensal ÷ 30) sobre o saldo,
   desde a última movimentação; cada pagamento quita primeiro os juros do período e o resto abate o saldo.
   Juros não pagos ficam no saldo e passam a render juros no movimento seguinte. */
// O extrato de um contrato numa data é pedido muitas vezes a cada redesenho da tela; fica guardado por contrato.
// Os objetos de contrato são trocados por novos a cada mudança (nunca alterados no lugar), então o guardado se renova.
const extratos=new WeakMap();
function extrato(c,ref){
  ref=ref||today();
  let m=extratos.get(c);if(!m)extratos.set(c,m=new Map());
  if(!m.has(ref))m.set(ref,calculaExtrato(c,ref));
  return m.get(ref);
}
function calculaExtrato(c,ref){
  const td=(+c.taxa)/100/30;
  const movs=[...(c.movimentos||[])].sort((a,b)=>a.data.localeCompare(b.data)||String(a.criadoEm||"").localeCompare(String(b.criadoEm||"")));
  let saldo=r2(c.valor),ult=c.dataContrato,pago=0,jurosPagos=0,capitalPago=0;
  const linhas=[{data:c.dataContrato,tipo:"emprestimo",dias:0,juros:0,valor:r2(c.valor),saldo}];
  for(const m of movs){
    const dias=Math.max(0,days(ult,m.data)),juros=r2(saldo*td*dias),v=r2(m.valor),pj=Math.min(v,juros);
    saldo=r2(saldo+juros-v);pago=r2(pago+v);jurosPagos=r2(jurosPagos+pj);capitalPago=r2(capitalPago+v-pj);ult=m.data;
    linhas.push({data:m.data,tipo:"pagamento",dias,juros,valor:v,saldo,mov:m});
  }
  const quitado=movs.length>0&&saldo<=0.009;
  const diasHoje=quitado?0:Math.max(0,days(ult,ref)),jurosHoje=quitado?0:r2(saldo*td*diasHoje);
  return {linhas,saldoBase:Math.max(0,saldo),ultima:ult,diasHoje,jurosHoje,saldoHoje:quitado?0:r2(saldo+jurosHoje),pago,jurosPagos,capitalPago,quitado,taxaDia:td};
}
/* saldo:fim */
/* calculo:fim */
function statusC(c){
  if(c.cancelado)return "cancelado";
  if(c.pendente)return "pendente"; // lançado pelo operador, aguardando o administrador confirmar o Pix
  if(isSaldo(c))return extrato(c).quitado?"quitado":c.vencimento<today()?"atrasado":"ativo";
  const ps=c.parcelas||[];
  if(ps.length&&ps.every(quitadaP))return "quitado";
  const t=today();
  if(ps.some(p=>!quitadaP(p)&&p.venc<t))return "atrasado";
  return "ativo";
}
const STP={pendente:["Aguardando Pix","warn"],ativo:["Em dia","ok"],atrasado:["Em atraso","bad"],quitado:["Quitado",""],cancelado:["Cancelado",""]};
const pillC=c=>{const [t,k]=STP[statusC(c)];return `<span class="pill ${k}">${t}</span>`};
// Índice de clientes por id, refeito só quando a lista muda (as listas procuram o cliente de cada linha).
let cliIdx={l:null,m:null};
const cli=id=>{if(cliIdx.l!==S.clientes)cliIdx={l:S.clientes,m:new Map(S.clientes.map(x=>[x.id,x]))};return cliIdx.m.get(id)||{nome:"(cliente removido)"}};
const ex=o=>o&&o.exemplo?'<span class="ex">exemplo</span>':"";
let abMemo={}; // a lista de parcelas em aberto é pedida várias vezes por redesenho: vale até contratos, config ou o dia mudarem
function abertas(){ // todas as parcelas em aberto com contexto (quem usa não altera a lista devolvida)
  const out=[],t=today();
  if(abMemo.c===S.contratos&&abMemo.g===S.config&&abMemo.t===t)return abMemo.v;
  abMemo={c:S.contratos,g:S.config,t,v:out};
  for(const c of S.contratos){if(c.cancelado||c.pendente)continue;
    if(isSaldo(c)){ // uma "parcela" só: o saldo de hoje; a receber no vencimento = saldo com os juros até lá
      const x=extrato(c);if(x.quitado)continue;
      const v=c.vencimento,atraso=Math.max(0,days(v,t)),devido=v>t?r2(x.saldoBase*(1+x.taxaDia*Math.max(0,days(x.ultima,v)))):x.saldoHoje;
      out.push({c,p:{n:1,venc:v,valor:x.saldoHoje},e:{atraso,multa:0,mora:0,total:devido,pago:0,devido}});continue}
    for(const p of c.parcelas||[])if(!quitadaP(p))out.push({c,p,e:encargos(p,c)});}
  return out;
}
const parcLbl=x=>isSaldo(x.c)?"Saldo":`${x.p.n}/${x.c.parcelas.length}`;
// Inadimplente = atraso a partir do corte de dias (Configurações) ou contrato marcado à mão, com motivo para o cobrador.
const corte=()=>Math.max(1,parseInt(cfg("corteDias"))||1);
const emInad=x=>!!x.c.inad||x.e.atraso>=corte();
const bannerInad=c=>c.inad&&!["quitado","cancelado"].includes(statusC(c))?`<div class="banner" style="background:var(--bad-soft);color:var(--bad);margin:0">Marcado como inadimplente em ${fdate(c.inad.em)}: ${esc(c.inad.motivo)}</div>`:"";
const bannerPend=c=>c.pendente&&!c.cancelado?`<div class="banner" style="margin:0">Aguardando a confirmação do Pix${c.lancadoPor?" · lançado por "+esc(c.lancadoPor):""}. O contrato só passa a valer depois que o administrador confirmar. ${souAdmin()?`<button class="sm pri" data-act="confirmarPix" data-id="${c.id}">Confirmar Pix</button>`:""}</div>`:"";
const btnInad=c=>c.inad?`<button data-act="desmarcarInad" data-id="${c.id}">Tirar da inadimplência</button>`:`<button data-act="marcarInad" data-id="${c.id}">Marcar inadimplente</button>`;
const saldoContrato=c=>isSaldo(c)?extrato(c).saldoHoje:r2((c.parcelas||[]).filter(p=>!quitadaP(p)).reduce((a,p)=>a+r2(p.valor-pagoP(p)),0));

/* ---------- banco ---------- */
async function boot(){
  try{
    db=await window.claude?.use?.("db");
    const user=await window.claude?.use?.("user");
    if(user){const w=await user.can("data.write");if(w===false)canWrite=false;}
  }catch(e){db=null}
  if(!db){$("#view").innerHTML='<div class="empty"><b>Não foi possível abrir o banco de dados</b>Entre na sua conta do claude.ai e abra este link novamente.</div>';return}
  for(const col of ["clientes","contratos","transacoes"]){
    db.collection(col).limit(1000).onSnapshot(s=>{S[col]=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded[col]=1;render()},err);
  }
  db.doc("config/geral").onSnapshot(s=>{S.config=s.exists?s.data():{};S.loaded.config=1;render()},err);
  // lembretes: dias de aviso (config/lembretes) e quem já foi avisado (avisos)
  db.doc("config/lembretes").onSnapshot(s=>{S.lemb=s.exists?s.data():{};render()},err);
  db.collection("avisos").limit(1000).onSnapshot(s=>{S.avisos=s.docs.map(d=>({id:d.id,...d.data()}));render()},err);
}
function err(e){toast("Erro no banco de dados: "+(e&&e.message||e))}
async function put(col,obj){
  if(!canWrite){toast("Você tem acesso só de leitura.");throw new Error("ro")}
  const {id,...rest}=obj;await db.doc(col+"/"+id).set(rest);
}
async function upd(col,id,data){if(!canWrite){toast("Você tem acesso só de leitura.");throw new Error("ro")}await db.doc(col+"/"+id).update(data)}
async function del(col,id){if(!canWrite){toast("Você tem acesso só de leitura.");throw new Error("ro")}await db.doc(col+"/"+id).delete()}
// Gravações que só fazem sentido juntas (pagamento no contrato + lançamento no caixa). No servidor próprio entram
// todas ou nenhuma; onde isso não existe, vão uma por uma. ops = [{op:"gravar"|"mesclar"|"excluir",col,id,dados}]
async function gravaJuntos(ops){
  if(!canWrite){toast("Você tem acesso só de leitura.");throw new Error("ro")}
  if(db.lote)return db.lote(ops);
  for(const o of ops){const d=db.doc(o.col+"/"+o.id);await(o.op==="gravar"?d.set(o.dados):o.op==="mesclar"?d.update(o.dados):d.delete())}
}

function rotular(el){el.querySelectorAll("table").forEach(t=>{const hs=[...t.querySelectorAll("thead th")].map(th=>th.textContent.trim());t.querySelectorAll("tbody tr").forEach(tr=>[...tr.children].forEach((td,i)=>{if(hs[i])td.dataset.l=hs[i]}))})}
function openDrawer(html){$("#layer").innerHTML=`<div class="scrim" data-close="1"><div class="drawer" role="dialog" aria-modal="true">${html}</div></div>`;rotular($("#layer"))}

/* ---------- gráficos ---------- */
function bars(data,{h=200,color="var(--accent)",lblEvery=1}={}){
  const W=640,H=h,L=70,R=10,T=12,B=26,max=Math.max(1,...data.map(d=>d.v));
  const step=niceStep(max/4),top=Math.ceil(max/step)*step||1;
  const bw=(W-L-R)/data.length;let g="";
  for(let y=0;y<=top+1e-9;y+=step){const py=T+(H-T-B)*(1-y/top);g+=`<line x1="${L}" x2="${W-R}" y1="${py}" y2="${py}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${py+4}" text-anchor="end">${short(y)}</text>`}
  data.forEach((d,i)=>{const bh=(H-T-B)*(d.v/top),x=L+i*bw+bw*.18,y=H-B-bh;
    g+=`<rect x="${x}" y="${y}" width="${bw*.64}" height="${Math.max(0,bh)}" rx="2" fill="${d.hi?"var(--fg)":color}"><title>${esc(d.t)}: ${money(d.v)}</title></rect>`;
    if(i%lblEvery===0||i===data.length-1)g+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${esc(d.l)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function niceStep(x){if(x<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(x))),m=x/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}
const short=v=>v>=1e6?"R$ "+(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi":v>=1e3?"R$ "+(v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":"R$ "+Math.round(v);

VIEWS.dashboard=()=>{
  const t=today(),ab=abertas();
  const totalEmp=S.contratos.filter(c=>!c.cancelado&&!c.pendente).reduce((a,c)=>a+(+c.valor||0),0);
  const recebido=S.transacoes.filter(x=>x.tipo==="entrada"&&x.contratoId).reduce((a,x)=>a+(+x.valor||0),0);
  const quit=S.contratos.filter(c=>statusC(c)==="quitado").length;
  const ativos=S.contratos.filter(c=>["ativo","atrasado"].includes(statusC(c)));
  const saldo=ab.reduce((a,x)=>a+r2(x.p.valor-x.e.pago),0);
  const atras=ab.filter(x=>x.e.atraso>0),inadL=ab.filter(emInad);
  const vAtras=inadL.reduce((a,x)=>a+r2(x.p.valor-x.e.pago),0);
  const cAtras=new Set(inadL.map(x=>x.c.id)).size;

  const soma=f=>ab.filter(f).reduce((a,x)=>a+x.e.devido,0);

  const inadMes=atras.filter(x=>x.p.venc.slice(0,7)===mes);

  const rec=[];for(let i=29;i>=0;i--){const dd=addDays(t,-i);rec.push({l:fdate(dd).slice(0,5),t:fdate(dd),v:S.transacoes.filter(x=>x.tipo==="entrada"&&x.contratoId&&x.data===dd).reduce((a,x)=>a+(+x.valor||0),0),hi:i===0})}

    ${kpi("Taxa de inadimplência",taxa.toLocaleString("pt-BR",{maximumFractionDigits:1})+"%",`${money(vAtras)} em ${cAtras} contratos`,taxa>0?"bad":"")}
  </div><div class="kpis">
    ${kpi("A receber hoje",money(hoje),fdate(t),"link","cobrancas","hoje")}
    ${kpi("A receber esta semana",money(sem),"Semana "+semana,"link","cobrancas","semana")}
    ${kpi("A receber este mês",money(mesV),parse(t).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}),"link","cobrancas","mes")}
    ${kpi("Inadimplência do mês",money(inadMes.reduce((a,x)=>a+x.e.devido,0)),`${new Set(inadMes.map(x=>x.c.id)).size} contratos atrasados`,"bad link","inadimplentes")}
  </div>

VIEWS.precadastro=()=>{
  const l=S.clientes.filter(c=>c.status==="pre").sort((a,b)=>(b.criadoEm||"").localeCompare(a.criadoEm||""));
  return `<p class="muted" style="margin-top:0">Pessoas interessadas que ainda não foram aprovadas. Ao aprovar, o cadastro vai para Clientes e já pode receber contratos.</p><section class="panel">${l.length?`<div class="tbl"><table><thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>Empresa</th><th>Origem</th><th>Cadastrado em</th><th></th></tr></thead><tbody>${l.map(c=>`<tr><td><b>${esc(c.nome)}</b>${ex(c)}${/^Atenção/.test(c.obs||"")?`<div class="muted" style="color:var(--warn)">${esc(c.obs)}</div>`:""}</td><td>${esc(c.cpf||"—")}</td><td>${esc(c.telefone||"—")}</td><td>${esc(c.empresa||"—")}</td><td>${c.origem==="link"?`<span class="pill ok">Link${c.franquia?" · "+esc(c.franquia):""}</span>`:'<span class="pill">Manual</span>'}</td><td>${fdate((c.criadoEm||"").slice(0,10))}</td><td><div class="row"><button class="sm pri" data-act="aprovar" data-id="${c.id}">Aprovar</button><button class="sm" data-act="verCliente" data-id="${c.id}">Abrir</button><button class="sm danger" data-act="recusar" data-id="${c.id}">Recusar</button></div></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty"><b>Nenhum pré-cadastro pendente</b>Use “Novo pré-cadastro” quando alguém pedir um empréstimo.</div>`}</section>`;
};
function tabs(key,opts){return Object.entries(opts).map(([k,l])=>`<button class="sm ${ui[key]===k?"on":""}" data-act="tab" data-k="${key}" data-v="${esc(k)}">${esc(l)}</button>`).join("")}
// Total pago e juros do contrato (os já pagos mais os que estão correndo hoje, nos contratos de saldo devedor).
function pagoEJuros(c){
  if(c.pendente)return {pago:0,juros:0};
  if(isSaldo(c)){const x=extrato(c);return {pago:x.pago,juros:r2(x.jurosPagos+x.jurosHoje)}}
  const ps=c.parcelas||[];return {pago:r2(ps.reduce((a,p)=>a+pagoP(p),0)),juros:r2(ps.reduce((a,p)=>a+p.valor,0)-(+c.valor||0))};
}
const ORDEM_SIT=["atrasado","pendente","ativo","quitado","cancelado"],NOME_SIT={atrasado:"Vencido",pendente:"Aguardando Pix",ativo:"Em dia",quitado:"Quitado",cancelado:"Cancelado"};
function conRows(list,agrupar){
  if(!list.length)return `<div class="empty"><b>Nenhum contrato aqui</b>Use “Novo contrato” para registrar um empréstimo.</div>`;
  const {vis,resto}=corta(list,"conMax"),cont={};
  if(agrupar)for(const c of list){const s=statusC(c);cont[s]=(cont[s]||0)+1}
  let ult=null;
  return `<div class="tbl"><table><thead><tr><th>Cliente</th><th>Início</th><th>Modalidade</th><th class="num">Emprestado</th><th class="num">Taxa</th><th class="num">Pagas</th><th class="num">Pago</th><th class="num">Juros</th><th class="num">Saldo hoje</th><th>Situação</th></tr></thead><tbody>${vis.map(c=>{const ps=c.parcelas||[],pj=pagoEJuros(c),sit=statusC(c);
    const grupo=agrupar&&sit!==ult?(ult=sit,`<tr class="grp"><td colspan="10"><b>${NOME_SIT[sit]} (${cont[sit]})</b></td></tr>`):"";
    return grupo+`<tr class="click" data-act="verContrato" data-id="${c.id}"><td><b>${esc(cli(c.clienteId).nome)}</b>${ex(c)}</td><td>${fdate(c.dataContrato)}</td><td>${MOD[c.modalidade]||""}<div class="muted">${isSaldo(c)?"vence "+fdate(c.vencimento):PER[c.periodicidade]}</div></td><td class="num">${money(c.valor)}</td><td class="num">${(+c.taxa).toLocaleString("pt-BR")}%${isSaldo(c)?" a.m.":""}</td><td class="num">${isSaldo(c)?(c.movimentos||[]).length+" pgto":ps.filter(quitadaP).length+"/"+ps.length}</td><td class="num">${money(pj.pago)}</td><td class="num">${money(pj.juros)}</td><td class="num"><b>${money(saldoContrato(c))}</b></td><td>${pillC(c)}${c.inad&&!["quitado","cancelado"].includes(statusC(c))?' <span class="pill bad">Inadimplente</span>':""}</td></tr>`}).join("")}</tbody></table></div>${resto}`;
}
VIEWS.contratos=()=>{
  const q=ui.conQ.toLowerCase();
  let l=S.contratos.filter(c=>!q||cli(c.clienteId).nome.toLowerCase().includes(q));
  if(ui.conSt!=="todos")l=l.filter(c=>statusC(c)===ui.conSt);
  const ag=ui.conSt==="todos"; // em "Todos" a lista vem agrupada por situação, com a contagem de cada grupo
  l.sort((a,b)=>(ag?ORDEM_SIT.indexOf(statusC(a))-ORDEM_SIT.indexOf(statusC(b)):0)||(b.dataContrato||"").localeCompare(a.dataContrato||""));
  const nSit={};for(const c of S.contratos)nSit[statusC(c)]=(nSit[statusC(c)]||0)+1;
  const n=k=>nSit[k]?` (${nSit[k]})`:"";
  return `<div class="toolbar"><input type="search" id="conQ" placeholder="Buscar por cliente" value="${esc(ui.conQ)}" aria-label="Buscar contratos"><div class="tabs">${tabs("conSt",{todos:"Todos ("+S.contratos.length+")",pendente:"Aguardando Pix"+n("pendente"),ativo:"Em dia"+n("ativo"),atrasado:"Em atraso"+n("atrasado"),quitado:"Quitados"+n("quitado"),cancelado:"Cancelados"+n("cancelado")})}</div></div><section class="panel">${conRows(l,ag)}</section>`;
};
VIEWS.inadimplentes=()=>{
  const at=abertas().filter(emInad),by={},cd=corte(),hoje=x=>isSaldo(x.c)?x.p.valor:x.e.devido; // saldo: o de hoje, não o projetado até o vencimento
  for(const x of at){(by[x.c.clienteId]=by[x.c.clienteId]||[]).push(x)}
  const rows=Object.entries(by).map(([cid,xs])=>({c:cli(cid),xs,tot:xs.reduce((a,x)=>a+hoje(x),0),max:Math.max(...xs.map(x=>x.e.atraso)),mot:[...new Set(xs.filter(x=>x.c.inad).map(x=>x.c.inad.motivo))]})).sort((a,b)=>b.max-a.max);
  const tot=rows.reduce((a,r)=>a+r.tot,0);
  const nota=`<p class="muted" style="margin-top:0">Entram aqui contratos com ${cd} dia${cd>1?"s":""} ou mais de atraso e os marcados como inadimplentes. O corte de dias fica em Configurações.</p>`;
  if(!rows.length)return nota+`<section class="panel"><div class="empty"><b>Nenhum cliente inadimplente</b>Quando um contrato passar do corte de dias, ou for marcado como inadimplente, ele aparece aqui.</div></section>`;
  return nota+`<div class="kpis">${kpi("Clientes inadimplentes",rows.length,"no corte de dias ou marcados")}${kpi("Contratos",new Set(at.map(x=>x.c.id)).size,"em aberto")}${kpi("Total devido hoje",money(tot),"com encargos","bad")}${kpi("Maior atraso",rows[0].max+" dias",rows[0].c.nome)}</div>
  <section class="panel"><div class="tbl"><table><thead><tr><th>Cliente</th><th>Telefone</th><th class="num">Parcelas</th><th class="num">Dias de atraso</th><th class="num">Valor original</th><th class="num">Encargos</th><th class="num">Total devido</th><th>Motivo</th><th></th></tr></thead><tbody>${rows.map(r=>{const orig=r.xs.reduce((a,x)=>a+x.p.valor-x.e.pago,0);return `<tr><td><b>${esc(r.c.nome)}</b>${ex(r.c)}</td><td>${esc(r.c.telefone||"—")}</td><td class="num">${r.xs.length}</td><td class="num">${r.max?`<span class="pill ${r.max>30?"bad":"warn"}">${r.max}</span>`:'<span class="pill bad">marcado</span>'}</td><td class="num">${money(orig)}</td><td class="num">${money(r.tot-orig)}</td><td class="num"><b>${money(r.tot)}</b></td><td>${r.mot.length?esc(r.mot.join(" · ")):'<span class="muted">—</span>'}</td><td><div class="row"><button class="sm" data-act="cobrar" data-id="${r.xs[0].c.id}" data-n="${r.xs[0].p.n}">Cobrar</button><button class="sm" data-act="verContrato" data-id="${r.xs[0].c.id}">Contrato</button></div></td></tr>`}).join("")}</tbody></table></div></section>`;
};
// Lembretes de hoje: o que vence nos dias configurados (padrão: amanhã e hoje). "Abrir conversa" abre o WhatsApp de
// quem está usando (celular ou WhatsApp Web) com a mensagem pronta, e marca o cliente como avisado.
const diasLemb=()=>Array.isArray(S.lemb.dias)&&S.lemb.dias.length?S.lemb.dias:[1,0];
const telWa=t=>{const d=String(t||"").replace(/\D/g,"");return d.length===10||d.length===11?"55"+d:/^55\d{10,11}$/.test(d)?d:""};
function lembretesHoje(){
  const t=today(),ds=diasLemb(),av=new Map(S.avisos.map(a=>[a.id,a]));
  return abertas().map(x=>({...x,falta:days(t,x.p.venc)})).filter(x=>ds.includes(x.falta)).map(x=>{
    const cl=cli(x.c.clienteId),id=[x.c.id,isSaldo(x.c)?"saldo":x.p.n,x.p.venc,x.falta].join("_"),tel=telWa(cl.telefone),aviso=av.get(id);
    return {...x,cl,id,tel,aviso,situacao:aviso?"avisado":cl.semLembrete?"recusa":!tel?"semtel":"avisar"};
  }).sort((a,b)=>a.falta-b.falta||String(a.cl.nome).localeCompare(String(b.cl.nome)));
}
const textoLembrete=x=>cfg("msg").replace(/\{nome\}/g,(x.cl.nome||"").split(" ")[0]).replace(/\{parcela\}/g,isSaldo(x.c)?"única":`${x.p.n}/${x.c.parcelas.length}`).replace(/\{valor\}/g,money(x.e.devido)).replace(/\{vencimento\}/g,fdate(x.p.venc)).replace(/\{atraso\}/g,x.e.atraso+" dias");
const quandoVence=f=>f>1?`em ${f} dias`:f===1?"amanhã":f===0?"hoje":`${-f} dia${f<-1?"s":""} de atraso`;
function viewLembretes(){
  const l=lembretesHoje(),feitos=l.filter(x=>x.situacao==="avisado").length;
  const acao=x=>{const link=`https://wa.me/${x.tel}?text=${encodeURIComponent(textoLembrete(x))}`;
    if(x.situacao==="avisado")return `<span class="pill ok">Avisado</span> <span class="muted">${esc(x.aviso.por||"")} ${new Date(x.aviso.quando).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</span> <a class="btn sm" href="${link}" target="_blank" rel="noopener">Abrir de novo</a>`;
    if(x.situacao==="recusa")return '<span class="pill">Não quer receber</span>';
    if(x.situacao==="semtel")return '<span class="pill warn">Sem celular</span>';
    return `<a class="btn sm pri" data-act="avisar" data-id="${x.id}" href="${link}" target="_blank" rel="noopener">Abrir conversa</a>`};
  return `<p class="muted" style="margin-top:0">O botão abre a conversa no seu WhatsApp (celular ou WhatsApp Web) com a mensagem pronta: é só conferir e enviar. O texto é o de Configurações → Mensagem de cobrança. <b>${feitos} de ${l.length}</b> já avisados hoje.</p>
  <section class="panel">${l.length?`<div class="tbl"><table><thead><tr><th>Cliente</th><th>Vencimento</th><th>Telefone</th><th class="num">Valor</th><th></th></tr></thead><tbody>${l.map(x=>`<tr><td><b>${esc(x.cl.nome)}</b>${ex(x.c)}</td><td>${fdate(x.p.venc)} <span class="muted">${quandoVence(x.falta)}</span></td><td>${esc(x.cl.telefone||"—")}</td><td class="num">${money(x.e.devido)}</td><td><div class="row">${acao(x)}</div></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty"><b>Ninguém para avisar hoje</b>Aparecem aqui os vencimentos de ${diasLemb().map(quandoVence).join(" e ")}.</div>`}</section>`;
}
VIEWS.cobrancas=()=>{
  const t=today(),ab=abertas();
  const abas=tabs("cobTab",{lembretes:"Lembretes de hoje",hoje:"Vencem hoje",semana:"Próximos 7 dias",mes:"Restante do mês",atrasadas:"Atrasadas"});
  if(ui.cobTab==="lembretes")return `<div class="toolbar"><div class="tabs">${abas}</div></div>${viewLembretes()}`;
  const f={hoje:x=>x.p.venc===t,semana:x=>x.p.venc>=t&&x.p.venc<=addDays(t,7),mes:x=>x.p.venc>=t&&x.p.venc.slice(0,7)===t.slice(0,7),atrasadas:x=>x.e.atraso>0};
  const l=ab.filter(f[ui.cobTab]).sort((a,b)=>a.p.venc.localeCompare(b.p.venc));
  const tot=l.reduce((a,x)=>a+x.e.devido,0);
  return `<div class="toolbar"><div class="tabs">${abas}</div><span class="muted" style="margin-left:auto">${l.length} parcelas · <b>${money(tot)}</b></span></div>
  <section class="panel">${l.length?`<div class="tbl"><table><thead><tr><th>Vencimento</th><th>Cliente</th><th>Telefone</th><th class="num">Parcela</th><th class="num">Valor a cobrar</th><th></th></tr></thead><tbody>${l.map(x=>{const cl=cli(x.c.clienteId);return `<tr><td>${fdate(x.p.venc)}${x.e.atraso?` <span class="pill bad">${x.e.atraso}d</span>`:""}</td><td><b>${esc(cl.nome)}</b>${ex(x.c)}</td><td>${esc(cl.telefone||"—")}</td><td class="num">${parcLbl(x)}</td><td class="num">${money(x.e.devido)}</td><td><div class="row"><button class="sm" data-act="cobrar" data-id="${x.c.id}" data-n="${x.p.n}">Mensagem</button><button class="sm pri" data-act="pagar" data-id="${x.c.id}" data-n="${x.p.n}">Receber</button></div></td></tr>`}).join("")}</tbody></table></div>`:`<div class="empty"><b>Nada para cobrar neste filtro</b>Troque a aba para ver outros vencimentos.</div>`}</section>`;
};
VIEWS.caixa=()=>{
  const ent=S.transacoes.filter(x=>x.tipo==="entrada").reduce((a,x)=>a+(+x.valor||0),0);
  const sai=S.transacoes.filter(x=>x.tipo==="saida").reduce((a,x)=>a+(+x.valor||0),0);
  const saldo=(+cfg("saldoInicial")||0)+ent-sai;
  const m=ui.cxMes,l=S.transacoes.filter(x=>(x.data||"").slice(0,7)===m).sort((a,b)=>(b.data+b.criadoEm).localeCompare(a.data+a.criadoEm));
  const me=l.filter(x=>x.tipo==="entrada").reduce((a,x)=>a+(+x.valor||0),0),ms=l.filter(x=>x.tipo==="saida").reduce((a,x)=>a+(+x.valor||0),0);
  return `<div class="kpis">${kpi("Saldo em caixa",money(saldo),"saldo inicial + entradas − saídas")}${kpi("Entradas no mês",money(me),l.filter(x=>x.tipo==="entrada").length+" lançamentos")}${kpi("Saídas no mês",money(ms),l.filter(x=>x.tipo==="saida").length+" lançamentos")}${kpi("Resultado do mês",money(me-ms),"entradas − saídas",me-ms<0?"bad":"")}</div>
  <div class="toolbar"><label class="f" style="flex-direction:row;align-items:center;gap:8px">Mês <input type="month" id="cxMes" value="${m}" style="width:auto"></label></div>
  <section class="panel">${l.length?`<div class="tbl"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Forma</th><th class="num">Valor</th><th></th></tr></thead><tbody>${l.map(x=>`<tr><td>${fdate(x.data)}</td><td>${esc(x.descricao)}${ex(x)}</td><td>${esc(x.categoria||"—")}</td><td>${esc(x.forma||"—")}</td><td class="num" style="color:var(${x.tipo==="entrada"?"--ok":"--bad"})">${x.tipo==="entrada"?"+":"−"} ${money(x.valor)}</td><td>${x.contratoId?`<button class="sm" data-act="verContrato" data-id="${x.contratoId}">Contrato</button>`:`<button class="sm danger" data-act="delLanc" data-id="${x.id}">Excluir</button>`}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty"><b>Sem lançamentos neste mês</b>Empréstimos concedidos e parcelas recebidas entram aqui automaticamente. Despesas e aportes você lança em “Novo lançamento”.</div>`}</section>`;
};

/* ---------- detalhes ---------- */
function verCliente(id){
  const c=S.clientes.find(x=>x.id===id);if(!c)return;
  if(c._resumo){toast("Cliente de outra rota: só os dados básicos aparecem.");return}
  const cs=S.contratos.filter(k=>k.clienteId===id).sort((a,b)=>(b.dataContrato||"").localeCompare(a.dataContrato||""));
  openDrawer(`<div class="hd"><div><h2>${esc(c.nome)}${ex(c)}</h2><div class="muted">${c.status==="pre"?"Pré-cadastro":c.status==="bloqueado"?"Bloqueado":"Cliente ativo"}</div></div><button data-act="close" aria-label="Fechar">Fechar</button></div>
  <div class="panel"><div class="body dl">${[["CPF",c.cpf],["RG",c.rg],["Telefone",c.telefone],["E-mail",c.email],["Endereço",c.endereco],["Indicação",c.indicacao],["Profissão",c.profissao],["Empresa",c.empresa],["Endereço do trabalho",c.enderecoTrabalho],["Tempo de carteira",c.tempoRegistro],["Renda mensal",c.renda?money(c.renda):""],["Rota",c.rota],["Origem",c.origem==="link"?"Link de pré-cadastro"+(c.franquia?" · "+c.franquia:""):"Cadastro manual"],["Lembretes no WhatsApp",c.semLembrete?"Não quer receber":"Recebe"],["Cadastrado em",fdate((c.criadoEm||"").slice(0,10))]].map(([k,v])=>`<div><span>${k}</span><b>${esc(v||"—")}</b></div>`).join("")}${c.referencias?`<div style="grid-column:1/-1;white-space:pre-line"><span>Contatos de referência</span>${esc(c.referencias)}</div>`:""}${c.obs?`<div style="grid-column:1/-1"><span>Observações</span>${esc(c.obs)}</div>`:""}</div></div>
  <div class="row"><button data-act="editCliente" data-id="${id}">Editar dados</button>${c.status!=="pre"?`<button class="pri" data-act="novoContrato" data-cli="${id}">Novo contrato</button>`:`<button class="pri" data-act="aprovar" data-id="${id}">Aprovar cadastro</button>`}<button data-act="bloquear" data-id="${id}">${c.status==="bloqueado"?"Desbloquear":"Bloquear"}</button><button class="danger" data-act="delCliente" data-id="${id}">Excluir</button></div>
  <section class="panel"><header><h2>Contratos</h2></header>${conRows(cs)}</section>`);
}
function verContratoSaldo(c){
  const cl=cli(c.clienteId),x=extrato(c),t=today(),aberto=!c.cancelado&&!x.quitado,atraso=Math.max(0,days(c.vencimento,t));
  const ren=c.renegociacoes||[],tx=(+c.taxa).toLocaleString("pt-BR",{maximumFractionDigits:4});

function verContrato(id){
  const c=S.contratos.find(x=>x.id===id);if(!c)return;
  if(isSaldo(c))return verContratoSaldo(c);
  const cl=cli(c.clienteId),ps=c.parcelas||[];
  const totalC=r2(ps.reduce((a,p)=>a+p.valor,0)),pago=r2(ps.reduce((a,p)=>a+pagoP(p),0));
  openDrawer(`<div class="hd"><div><h2>Contrato de ${esc(cl.nome)}${ex(c)}</h2><div class="row" style="margin-top:4px">${pillC(c)}<span class="muted">${MOD[c.modalidade]} · ${PER[c.periodicidade]}</span></div></div><button data-act="close">Fechar</button></div>
  ${bannerPend(c)}${bannerInad(c)}<div class="panel"><div class="body dl">${[["Valor emprestado",money(c.valor)],["Taxa",(+c.taxa).toLocaleString("pt-BR")+"% ao período"],["Total do contrato",money(totalC)],["Lucro previsto",money(totalC-c.valor)],["Já recebido",money(pago)],["Saldo em aberto",money(saldoContrato(c))],["Data do contrato",fdate(c.dataContrato)],["Multa / mora",`${esc(c.multa)}% + ${esc(c.mora)}%/dia`]].map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join("")}${c.obs?`<div style="grid-column:1/-1"><span>Observações</span>${esc(c.obs)}</div>`:""}</div></div>
  <section class="panel"><header><h2>Parcelas</h2></header><div class="tbl"><table><thead><tr><th>#</th><th>Vencimento</th><th class="num">Valor</th><th class="num">Encargos</th><th class="num">Pago</th><th>Situação</th><th></th></tr></thead><tbody>${ps.map(p=>{const e=encargos(p,c);const st=quitadaP(p)?`<span class="pill ok">Paga ${fdate((p.pagamentos.at(-1)||{}).data)}</span>`:e.atraso?`<span class="pill bad">${e.atraso} dias</span>`:e.pago>0?'<span class="pill warn">Parcial</span>':'<span class="pill">Aberta</span>';
    return `<tr><td>${p.n}</td><td>${fdate(p.venc)}</td><td class="num">${money(p.valor)}</td><td class="num">${quitadaP(p)?"—":money(e.multa+e.mora)}</td><td class="num">${money(e.pago)}</td><td>${st}</td><td><div class="row">${!quitadaP(p)&&!c.cancelado?`<button class="sm pri" data-act="pagar" data-id="${c.id}" data-n="${p.n}">Receber</button><button class="sm" data-act="cobrar" data-id="${c.id}" data-n="${p.n}">Cobrar</button>`:""}${(p.pagamentos||[]).length?`<button class="sm" data-act="estornar" data-id="${c.id}" data-n="${p.n}">Estornar</button>`:""}</div></td></tr>`}).join("")}</tbody></table></div></section>
  <div class="row">${!c.cancelado&&statusC(c)!=="quitado"?`${btnInad(c)}<button data-act="cancelarC" data-id="${id}">Cancelar contrato</button>`:""}<button class="danger" data-act="delContrato" data-id="${id}">Excluir contrato</button><button data-act="verCliente" data-id="${c.clienteId}">Ver cliente</button></div>`);
}

function formContrato(cliId){
  const cls=S.clientes.filter(c=>!c._resumo&&(c.status==="ativo"||!c.status)).sort((a,b)=>a.nome.localeCompare(b.nome));
  if(!cls.length){toast("Cadastre ou aprove um cliente antes de criar o contrato.");return}
  const t=today(),adm=souAdmin();
  openModal(`<h3>Novo contrato</h3>${adm?"":'<div class="banner" style="margin:0">O contrato fica aguardando o administrador confirmar o Pix. Só depois disso ele passa a valer.</div>'}<form id="fCon" class="form">
    <label class="f full">Cliente<select name="clienteId" required>${cls.map(c=>`<option value="${c.id}" ${c.id===cliId?"selected":""}>${esc(c.nome)}</option>`).join("")}</select></label>
    <label class="f">Valor emprestado (R$)<input name="valor" type="number" step="0.01" min="1" required value="1000"></label>

    <label class="f parc">Número de parcelas<input name="nParcelas" type="number" min="1" max="360" required value="1"></label>

    <label class="f">Data do contrato<input name="dataContrato" type="date" required value="${t}"></label>
    <label class="f">Forma de liberação<select name="forma"><option>Pix</option><option>Dinheiro</option><option>Transferência</option></select></label>
    <label class="f parc">Multa por atraso (%)<input name="multa" type="number" step="0.01" min="0" value="${cfg("multa")}"></label>
    <label class="f parc">Mora (% ao dia)<input name="mora" type="number" step="0.001" min="0" value="${cfg("mora")}"></label>
    <label class="f full">Observações<textarea name="obs" style="min-height:50px"></textarea></label>
    <div class="calc full" id="sim"></div>
    <div class="row end full"><button type="button" data-act="close">Cancelar</button><button class="pri" type="submit">${adm?"Criar contrato":"Lançar contrato"}</button></div></form>`);
  const f=$("#fCon"),F=n=>f.elements[n];
  let fixa=false,erroParcela=""; // fixa = o valor da parcela foi digitado; a taxa passa a ser calculada a partir dele
  const sim=ev=>{
    const alvo=ev&&ev.target&&ev.target.name,sd=F("modalidade").value==="saldo";
    if(alvo==="parcela")fixa=+F("parcela").value>0;
    else if(["valor","taxa","nParcelas","modalidade"].includes(alvo))fixa=false;
    erroParcela="";
    if(fixa&&!sd){
      const tx=taxaDaParcela(F("modalidade").value,+F("valor").value,Math.max(1,parseInt(F("nParcelas").value)||1),+F("parcela").value);
      if(tx===null)erroParcela="Com essa parcela o total fica menor que o valor emprestado.";else F("taxa").value=String(Math.round(tx*10000)/10000);
    }
    const d=formData(f);
    f.querySelectorAll(".parc").forEach(el=>el.hidden=sd);
    $("#lblTaxa").textContent=sd?"Taxa de juros (% ao mês)":"Taxa de juros (% por período)";$("#lblVenc").textContent=sd?"Vencimento":"Primeiro vencimento";
    if(!(+d.valor>0)||!d.primeiroVenc){$("#sim").innerHTML="";return}
    if(sd){const td=(+d.taxa)/100/30,dias=Math.max(0,days(d.dataContrato||t,d.primeiroVenc)),j=r2(+d.valor*td*dias);
      $("#sim").innerHTML=`<div><span>Juros por dia</span><span>${money(+d.valor*td)} · ${(td*100).toLocaleString("pt-BR",{maximumFractionDigits:3})}% ao dia</span></div><div><span>Juros até o vencimento (${dias} dias)</span><span>${money(j)}</span></div><div class="t"><span>Para quitar no vencimento</span><span>${money(+d.valor+j)}</span></div><div class="muted">Os juros correm por dia sobre o saldo. Cada pagamento quita primeiro os juros e o resto abate o saldo.</div>`;return}
    if(erroParcela){$("#sim").innerHTML=`<div style="color:var(--bad)">${erroParcela}</div>`;return}
    const ps=gerarParcelas(fixa?{...d,parcelaFixa:+d.parcela}:d),tot=ps.reduce((a,p)=>a+p.valor,0);
    if(!fixa&&document.activeElement!==F("parcela"))F("parcela").value=ps[0].valor.toFixed(2);
    $("#sim").innerHTML=`<div><span>Parcela${ps.length>1?"s":""}</span><b>${ps.length}× ${money(ps[0].valor)}${ps.length>1&&ps.at(-1).valor!==ps[0].valor?` (última ${money(ps.at(-1).valor)})`:""}</b></div>${fixa?`<div><span>Taxa calculada pela parcela</span><b>${(+d.taxa).toLocaleString("pt-BR",{maximumFractionDigits:4})}% por período</b></div>`:""}<div><span>Vencimentos</span><span>${fdate(ps[0].venc)}${ps.length>1?" a "+fdate(ps.at(-1).venc):""}</span></div><div><span>Juros totais</span><span>${money(tot-d.valor)}</span></div><div class="t"><span>Total a receber</span><span>${money(tot)}</span></div>`};
  f.oninput=sim;sim();
  f.onsubmit=async e=>{e.preventDefault();const d=formData(f),sd=d.modalidade==="saldo";
    if(erroParcela&&!sd){toast(erroParcela);return}
    const c={id:uid("ct"),clienteId:d.clienteId,valor:+d.valor,taxa:+d.taxa,modalidade:d.modalidade,primeiroVenc:d.primeiroVenc,dataContrato:d.dataContrato,obs:d.obs,forma:d.forma,criadoEm:new Date().toISOString()};
    if(sd)Object.assign(c,{vencimento:d.primeiroVenc,movimentos:[],renegociacoes:[],parcelas:[]});
    else{Object.assign(c,{periodicidade:d.periodicidade,nParcelas:+d.nParcelas,multa:+d.multa,mora:+d.mora});if(fixa)c.parcelaFixa=r2(+d.parcela);c.parcelas=gerarParcelas(c)}
    const {id:cid,...dadosC}=c,ops=[{op:"gravar",col:"contratos",id:cid,dados:dadosC}];
    // operador: o contrato nasce aguardando o Pix (o servidor garante); a saída do caixa entra quando o administrador confirmar
    if(adm)ops.push({op:"gravar",col:"transacoes",id:uid("tx"),dados:{tipo:"saida",valor:c.valor,data:c.dataContrato,categoria:"Empréstimo concedido",descricao:"Empréstimo para "+cli(c.clienteId).nome,forma:d.forma,contratoId:c.id,clienteId:c.clienteId,criadoEm:new Date().toISOString()}});
    else dadosC.pendente=true;
    try{await gravaJuntos(ops);closeTop();toast(adm?"Contrato criado":"Contrato lançado. Aguardando o administrador confirmar o Pix.");verContrato(c.id)}catch(_){}};
}

function formPagar(cid,n){
  const c=S.contratos.find(x=>x.id===cid),p=c&&c.parcelas.find(x=>x.n===n);if(!p)return;
  const e=encargos(p,c);
  openModal(`<h3>Receber parcela ${p.n}/${c.parcelas.length} · ${esc(cli(c.clienteId).nome)}</h3>
  <div class="calc"><div><span>Valor da parcela</span><span>${money(p.valor)}</span></div>${e.atraso?`<div><span>Multa (${esc(c.multa)}%)</span><span>${money(e.multa)}</span></div><div><span>Mora (${e.atraso} dias × ${esc(c.mora)}%)</span><span>${money(e.mora)}</span></div>`:""}${e.pago?`<div><span>Já pago</span><span>− ${money(e.pago)}</span></div>`:""}<div class="t"><span>Total devido hoje</span><span>${money(e.devido)}</span></div></div>
  <form id="fPag" class="form"><label class="f">Valor recebido (R$)<input name="valor" type="number" step="0.01" min="0.01" required value="${e.devido.toFixed(2)}"></label>
  <label class="f">Data do pagamento<input name="data" type="date" required value="${today()}"></label>
  <label class="f full">Forma<select name="forma"><option>Pix</option><option>Dinheiro</option><option>Transferência</option><option>Cartão</option></select></label>
  <p class="muted full" style="margin:0">Se o valor for menor que o devido, a parcela fica com pagamento parcial e o restante continua em aberto.</p>
  <div class="row end full"><button type="button" data-act="close">Cancelar</button><button class="pri" type="submit">Registrar recebimento</button></div></form>`);
  $("#fPag").onsubmit=async ev=>{ev.preventDefault();const d=formData(ev.target),v=r2(+d.valor);
    // o contrato como está agora: outra pessoa pode ter lançado um pagamento com esta janela aberta
    const c2=S.contratos.find(x=>x.id===cid),p2=c2&&c2.parcelas.find(x=>x.n===n);
    if(!p2||c2.cancelado||quitadaP(p2)){closeTop();toast("Esta parcela não está mais em aberto.");return}
    const ed=encargos(p2,c2,d.data),txId=uid("tx"),quita=v>=ed.devido-0.009;
    if(v>ed.devido+0.009){toast("O valor passa do total devido ("+money(ed.devido)+").");return}
    const parcelas=c2.parcelas.map(x=>x.n!==n?x:{...x,pagamentos:[...(x.pagamentos||[]),{data:d.data,valor:v,txId,forma:d.forma}],quitada:quita});
    try{await gravaJuntos([{op:"mesclar",col:"contratos",id:cid,dados:{parcelas}},
        {op:"gravar",col:"transacoes",id:txId,dados:{tipo:"entrada",valor:v,data:d.data,categoria:"Recebimento de parcela",descricao:`Parcela ${n}/${c2.parcelas.length} · ${cli(c2.clienteId).nome}`,forma:d.forma,contratoId:cid,clienteId:c2.clienteId,criadoEm:new Date().toISOString()}}]);
      closeTop();toast(quita?"Parcela quitada":"Pagamento parcial registrado");if($(".drawer"))verContrato(cid)}catch(_){}};
}
function formPagarSaldo(cid){
  let c=S.contratos.find(x=>x.id===cid);if(!c)return;
  const x0=extrato(c),t=today();
  openModal(`<h3>Registrar pagamento · ${esc(cli(c.clienteId).nome)}</h3><div class="calc" id="pgCalc"></div>
  <form id="fPag" class="form"><label class="f">Data do pagamento<input name="data" type="date" required min="${x0.ultima}" value="${t<x0.ultima?x0.ultima:t}"></label>
  <label class="f">Valor recebido (R$)<input name="valor" type="number" step="0.01" min="0.01" required></label>
  <div class="row full"><button type="button" class="sm" data-fill="juros">Só os juros</button><button type="button" class="sm" data-fill="total">Quitar tudo</button></div>
  <label class="f">Forma<select name="forma"><option>Pix</option><option>Dinheiro</option><option>Transferência</option><option>Cartão</option></select></label>
  <label class="f">Novo vencimento (opcional)<input name="novoVenc" type="date"></label>
  <div class="calc full" id="pgSplit"></div>
  <div class="row end full"><button type="button" data-act="close">Cancelar</button><button class="pri" type="submit">Registrar pagamento</button></div></form>`);
  const f=$("#fPag"),F=n=>f.elements[n],calc=()=>{
    const dt=F("data").value||t,x=extrato(c,dt),v=r2(+F("valor").value||0),pj=Math.min(v,x.jurosHoje),pc=r2(v-pj),dep=r2(x.saldoHoje-v);
    $("#pgCalc").innerHTML=`<div><span>Saldo depois do último movimento (${fdate(x.ultima)})</span><span>${money(x.saldoBase)}</span></div><div><span>Juros de ${x.diasHoje} dias (${(+c.taxa).toLocaleString("pt-BR")}% ao mês ÷ 30)</span><span>${money(x.jurosHoje)}</span></div><div class="t"><span>Para quitar em ${fdate(dt)}</span><span>${money(x.saldoHoje)}</span></div>`;
    $("#pgSplit").innerHTML=v>0?`<div><span>Vai para juros</span><span>${money(pj)}</span></div><div><span>Vai para capital</span><span>${money(pc)}</span></div><div class="t"><span>${dep<=0.009?"Contrato quitado":"Saldo depois do pagamento"}</span><span>${money(Math.max(0,dep))}</span></div>`:"";
    return {x,v,pj,pc,dep}};
  f.oninput=calc;calc();
  f.querySelectorAll("[data-fill]").forEach(b=>b.onclick=()=>{const x=extrato(c,F("data").value||t),j=b.dataset.fill==="juros";
    F("valor").value=(j?x.jurosHoje:x.saldoHoje).toFixed(2);if(j&&!F("novoVenc").value)F("novoVenc").value=addMonths(c.vencimento,1);calc()});
  f.onsubmit=async ev=>{ev.preventDefault();
    // o contrato como está agora (outra pessoa pode ter lançado um pagamento com esta janela aberta); o cálculo é refeito
    c=S.contratos.find(x=>x.id===cid)||c;
    const {x,v,pj,pc,dep}=calc(),d=formData(f);
    if(c.cancelado||x.quitado){closeTop();toast("Este contrato não está mais em aberto.");return}
    if(!(v>0)){toast("Informe o valor recebido.");return}
    if(d.data<x.ultima){toast("A data não pode ser anterior ao último movimento ("+fdate(x.ultima)+").");return}
    if(v>x.saldoHoje+0.009){toast("O valor passa do total para quitar ("+money(x.saldoHoje)+").");return}
    const now=new Date().toISOString(),nome=cli(c.clienteId).nome,base={tipo:"entrada",data:d.data,forma:d.forma,contratoId:c.id,clienteId:c.clienteId,criadoEm:now};
    const m={id:uid("mv"),data:d.data,valor:v,juros:pj,capital:pc,forma:d.forma,criadoEm:now},mud={},caixa=[];
    if(pj>0){m.txJ=uid("tx");caixa.push({op:"gravar",col:"transacoes",id:m.txJ,dados:{...base,valor:pj,categoria:"Pagamento de juros",descricao:"Juros · "+nome}})}
    if(pc>0){m.txC=uid("tx");caixa.push({op:"gravar",col:"transacoes",id:m.txC,dados:{...base,valor:pc,categoria:"Pagamento de capital",descricao:"Capital · "+nome}})}
    if(d.novoVenc&&d.novoVenc!==c.vencimento&&dep>0.009){m.vencAnterior=c.vencimento;mud.vencimento=d.novoVenc;mud.renegociacoes=[...(c.renegociacoes||[]),{data:d.data,de:c.vencimento,para:d.novoVenc,motivo:"Pagamento de "+money(v),movId:m.id}]}
    try{await gravaJuntos([{op:"mesclar",col:"contratos",id:cid,dados:{...mud,movimentos:[...(c.movimentos||[]),m]}},...caixa]);
      closeTop();toast(dep<=0.009?"Contrato quitado":"Pagamento registrado");if($(".drawer"))setTimeout(()=>verContrato(cid),300)}catch(_){}};
}
function estornarSaldo(cid){
  const c=S.contratos.find(x=>x.id===cid),last=c&&extrato(c).linhas.at(-1).mov;if(!last)return;
  confirmar(`Estornar o pagamento de ${money(last.valor)} feito em ${fdate(last.data)}?`,async()=>{
    const c2=S.contratos.find(x=>x.id===cid),ult=c2&&extrato(c2).linhas.at(-1).mov; // o contrato como está agora
    if(!ult||ult.id!==last.id){toast("O contrato mudou. Abra de novo e confira.");return}
    const r=(c2.renegociacoes||[]).find(x=>x.movId===last.id),data={movimentos:(c2.movimentos||[]).filter(m=>m.id!==last.id)};
    if(r){data.renegociacoes=c2.renegociacoes.filter(x=>x!==r);if(c2.vencimento===r.para)data.vencimento=r.de}
    try{await gravaJuntos([{op:"mesclar",col:"contratos",id:cid,dados:data},...[last.txJ,last.txC].filter(Boolean).map(t=>({op:"excluir",col:"transacoes",id:t}))]);
      toast("Pagamento estornado");setTimeout(()=>verContrato(cid),300)}catch(_){}
  },"Estornar");
}
function formMarcarInad(cid){
  const c=S.contratos.find(x=>x.id===cid);if(!c)return;
  openModal(`<h3>Marcar como inadimplente</h3><div class="muted">O contrato entra na tela de Inadimplentes mesmo antes do corte de dias. O motivo aparece para o cobrador.</div>
  <form id="fInad" class="form"><label class="f full">Motivo<textarea name="motivo" required placeholder="Ex.: não atende o telefone desde o vencimento" style="min-height:60px"></textarea></label>
  <div class="row end full"><button type="button" data-act="close">Cancelar</button><button class="pri" type="submit">Marcar</button></div></form>`);
  $("#fInad").onsubmit=async e=>{e.preventDefault();const m=formData(e.target).motivo.trim();if(!m)return;
    try{await upd("contratos",cid,{inad:{motivo:m,em:today()}});closeTop();toast("Contrato marcado como inadimplente");setTimeout(()=>verContrato(cid),300)}catch(_){}};
}
function formRenegociar(cid){
  const c=S.contratos.find(x=>x.id===cid);if(!c)return;
  openModal(`<h3>Renegociar vencimento</h3><div class="muted">Vencimento atual: ${fdate(c.vencimento)}. Os juros continuam correndo por dia até o pagamento.</div>
  <form id="fRen" class="form"><label class="f">Novo vencimento<input name="para" type="date" required value="${addMonths(c.vencimento<today()?today():c.vencimento,1)}"></label>
  <label class="f">Motivo<input name="motivo" placeholder="Ex.: pediu mais prazo"></label>
  <div class="row end full"><button type="button" data-act="close">Cancelar</button><button class="pri" type="submit">Salvar</button></div></form>`);
  $("#fRen").onsubmit=async e=>{e.preventDefault();const d=formData(e.target),c2=S.contratos.find(x=>x.id===cid)||c; // o contrato como está agora
    if(d.para===c2.vencimento){closeTop();return}
    try{await upd("contratos",cid,{vencimento:d.para,renegociacoes:[...(c2.renegociacoes||[]),{data:today(),de:c2.vencimento,para:d.para,motivo:d.motivo||""}]});closeTop();toast("Vencimento alterado");setTimeout(()=>verContrato(cid),300)}catch(_){}};
}
function estornar(cid,n){
  const c=S.contratos.find(x=>x.id===cid),p=c&&c.parcelas.find(x=>x.n===n);if(!p||!(p.pagamentos||[]).length)return;
  const last=p.pagamentos.at(-1);
  confirmar(`Estornar o pagamento de ${money(last.valor)} feito em ${fdate(last.data)}?`,async()=>{
    const c2=S.contratos.find(x=>x.id===cid),p2=c2&&c2.parcelas.find(x=>x.n===n),ult=p2&&(p2.pagamentos||[]).at(-1); // o contrato como está agora
    if(!ult||ult.txId!==last.txId||ult.valor!==last.valor||ult.data!==last.data){toast("O contrato mudou. Abra de novo e confira.");return}
    const parcelas=c2.parcelas.map(x=>x.n!==n?x:{...x,pagamentos:x.pagamentos.slice(0,-1),quitada:false});
    try{await gravaJuntos([{op:"mesclar",col:"contratos",id:cid,dados:{parcelas}},...(last.txId?[{op:"excluir",col:"transacoes",id:last.txId}]:[])]);
      toast("Pagamento estornado");setTimeout(()=>verContrato(cid),300)}catch(_){}
  },"Estornar");
}
function mensagem(cid,n){
  const c=S.contratos.find(x=>x.id===cid);if(!c)return;
  let k;
  if(isSaldo(c))k={parc:"única",valor:extrato(c).saldoHoje,venc:c.vencimento,atraso:Math.max(0,days(c.vencimento,today()))};
  else{const p=c.parcelas.find(x=>x.n===n);if(!p)return;const e=encargos(p,c);k={parc:`${p.n}/${c.parcelas.length}`,valor:e.devido,venc:p.venc,atraso:e.atraso}}
  const cl=cli(c.clienteId);
  const txt=cfg("msg").replace(/\{nome\}/g,(cl.nome||"").split(" ")[0]).replace(/\{parcela\}/g,k.parc).replace(/\{valor\}/g,money(k.valor)).replace(/\{vencimento\}/g,fdate(k.venc)).replace(/\{atraso\}/g,k.atraso+" dias");
  const tel=String(cl.telefone||"").replace(/\D/g,""),full=tel.length>=10&&tel.length<=11?"55"+tel:tel;
  openModal(`<h3>Mensagem de cobrança</h3><div class="muted">${esc(cl.nome)} · ${esc(cl.telefone||"sem telefone")}</div><div class="msgbox" id="msgTxt">${esc(txt)}</div>
  <div class="row end"><button data-act="close">Fechar</button><button id="cpMsg">Copiar texto</button>${full?`<a class="btn pri" target="_blank" rel="noopener" href="https://wa.me/${full}?text=${encodeURIComponent(txt)}">Abrir no WhatsApp</a>`:""}</div>`);
  $("#cpMsg").onclick=()=>{navigator.clipboard?.writeText(txt).then(()=>toast("Mensagem copiada"),()=>{const r=document.createRange();r.selectNodeContents($("#msgTxt"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Texto selecionado: use Ctrl+C")})};
}
function formLanc(){
  openModal(`<h3>Novo lançamento no caixa</h3><form id="fLan" class="form">
  <label class="f">Tipo<select name="tipo"><option value="saida">Saída (despesa, retirada)</option><option value="entrada">Entrada (aporte, outra receita)</option></select></label>
  <label class="f">Valor (R$)<input name="valor" type="number" step="0.01" min="0.01" required></label>
  <label class="f full">Descrição<input name="descricao" required placeholder="Ex.: combustível para cobranças"></label>
  <label class="f">Categoria<input name="categoria" list="cats" placeholder="Despesa operacional"><datalist id="cats"><option>Despesa operacional</option><option>Aporte de capital</option><option>Retirada do sócio</option><option>Comissão</option></datalist></label>
  <label class="f">Data<input name="data" type="date" required value="${today()}"></label>
  <label class="f full">Forma<select name="forma"><option>Pix</option><option>Dinheiro</option><option>Transferência</option></select></label>
  <div class="row end full"><button type="button" data-act="close">Cancelar</button><button class="pri" type="submit">Lançar</button></div></form>`);
  $("#fLan").onsubmit=async e=>{e.preventDefault();const d=formData(e.target);try{await put("transacoes",{...d,id:uid("tx"),valor:+d.valor,criadoEm:new Date().toISOString()});closeTop();toast("Lançamento registrado")}catch(_){}};
}

/* ---------- eventos ---------- */
document.addEventListener("click",async e=>{
  const sc=e.target.closest(".scrim");if(sc&&e.target===sc){closeTop();return}
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act,id=a.dataset.id,n=+a.dataset.n;
  if(a.tagName==="TR"&&e.target.closest("button"))return;
  e.stopPropagation();
  switch(act){
    case"close":closeTop();break;
    case"tab":ui[a.dataset.k]=a.dataset.v;ui.cliMax=ui.conMax=LOTE_LINHAS;render();break;
    case"mais":ui[a.dataset.k]+=LOTE_LINHAS;render();break;
    case"go":if(a.dataset.tab)ui.cobTab=a.dataset.tab;location.hash=a.dataset.go;break;
    case"novoCliente":formCliente(null,!!a.dataset.pre);break;
    case"editCliente":formCliente(S.clientes.find(x=>x.id===id));break;
    case"verCliente":verCliente(id);break;
    case"verContrato":verContrato(id);break;
    case"novoContrato":formContrato(a.dataset.cli);break;
    case"pagar":{const c=S.contratos.find(x=>x.id===id);
      if(!podeReceber()){toast("Só o administrador dá baixa em pagamentos.");break}
      if(c&&c.pendente){toast("Este contrato ainda aguarda a confirmação do Pix.");break}
      isSaldo(c)?formPagarSaldo(id):formPagar(id,n);break}
    case"confirmarPix":formConfirmarPix(id);break;
    case"cobrar":mensagem(id,n);break;
    case"avisar":{const x=lembretesHoje().find(y=>y.id===id);if(x&&!x.aviso)put("avisos",{id,quando:new Date().toISOString(),por:window.__ccUsuario||"",contratoId:x.c.id,clienteId:x.c.clienteId,venc:x.p.venc,falta:x.falta}).catch(()=>{});break} // o link abre o WhatsApp normalmente
    case"estornar":estornar(id,n);break;
    case"estornarSaldo":estornarSaldo(id);break;
    case"renegociar":formRenegociar(id);break;
    case"marcarInad":formMarcarInad(id);break;
    case"desmarcarInad":confirmar("Tirar este contrato da inadimplência? Ele só volta para a lista se passar do corte de dias.",async()=>{try{await upd("contratos",id,{inad:null});toast("Marcação removida");setTimeout(()=>verContrato(id),300)}catch(_){}},"Tirar");break;
    case"novoLanc":formLanc();break;
    case"aprovar":try{await upd("clientes",id,{status:"ativo"});toast("Cadastro aprovado");if($(".drawer"))verCliente(id)}catch(_){}break;
    case"recusar":confirmar("Recusar e excluir este pré-cadastro?",async()=>{try{await del("clientes",id);toast("Pré-cadastro excluído")}catch(_){}},"Recusar");break;
    case"bloquear":{const c=S.clientes.find(x=>x.id===id);try{await upd("clientes",id,{status:c.status==="bloqueado"?"ativo":"bloqueado"});setTimeout(()=>verCliente(id),300)}catch(_){}break}
    case"delCliente":if(S.contratos.some(k=>k.clienteId===id)){toast("Este cliente tem contratos. Exclua os contratos antes.");break}confirmar("Excluir este cliente?",async()=>{try{await del("clientes",id);closeTop();toast("Cliente excluído")}catch(_){}},"Excluir");break;
    case"cancelarC":confirmar("Cancelar este contrato? As parcelas em aberto deixam de ser cobradas.",async()=>{try{await upd("contratos",id,{cancelado:true});setTimeout(()=>verContrato(id),300)}catch(_){}},"Cancelar contrato");break;
    case"delContrato":confirmar("Excluir o contrato e todos os lançamentos de caixa ligados a ele?",async()=>{try{await gravaJuntos([...S.transacoes.filter(x=>x.contratoId===id).map(t=>({op:"excluir",col:"transacoes",id:t.id})),{op:"excluir",col:"contratos",id}]);closeTop();toast("Contrato excluído")}catch(_){}},"Excluir");break;
    case"delLanc":confirmar("Excluir este lançamento?",async()=>{try{await del("transacoes",id);toast("Lançamento excluído")}catch(_){}},"Excluir");break;
    case"limparEx":confirmar("Remover todos os dados de exemplo?",async()=>{try{for(const col of ["transacoes","contratos","clientes"])for(const x of S[col].filter(x=>x.exemplo))await del(col,x.id);toast("Dados de exemplo removidos")}catch(_){}},"Remover");break;
  }
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".kpi[data-act]")){e.preventDefault();e.target.click()}});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="cliQ"||t.id==="conQ"){ui[t.id]=t.value;ui.cliMax=ui.conMax=LOTE_LINHAS;focusId=t.id;focusPos=t.selectionStart;render();}
  if(t.id==="cxMes"&&t.value){ui.cxMes=t.value;render()}
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="fCfg")return;e.preventDefault();const d=formData(e.target);
  try{if(!canWrite)throw 0;await db.doc("config/geral").set({nome:d.nome,taxa:+d.taxa,saldoInicial:+d.saldoInicial||0,multa:+d.multa,mora:+d.mora,corteDias:Math.max(1,parseInt(d.corteDias)||1),msg:d.msg,empresaPublica:(d.empresaPublica||"").trim(),avisoPrivacidade:(d.avisoPrivacidade||"").trim(),rotas:(d.rotas||"").split(",").map(x=>x.trim()).filter(Boolean).join(", "),operadorRecebe:d.operadorRecebe==="on"});toast("Configurações salvas")}catch(_){toast("Não foi possível salvar.")}
});
$("#menuBtn").onclick=e=>{e.stopPropagation();$("#side").classList.toggle("open")};
document.addEventListener("click",e=>{const s=$("#side");if(s.classList.contains("open")&&!s.contains(e.target)&&!e.target.closest("#menuBtn"))s.classList.remove("open")},true); // tocar fora fecha o menu no celular
function route(){const h=location.hash.slice(1);view=TITLES[h]?h:"dashboard";focusId=null;$("#side").classList.remove("open");$("#layer").innerHTML="";render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
route();boot();
})();
</script>
