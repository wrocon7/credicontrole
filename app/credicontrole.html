<title>CrediControle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sidebar de navegação fixa + área de trabalho com cartões de indicadores, tabelas e gavetas de detalhe */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#eef2ee; --line:#dde3dc;
  --fg:#17221c; --muted:#5d6b62; --side:#10241b; --side-fg:#cfe0d5; --side-muted:#7f9b8a;
  --accent:#1f7a52; --accent-fg:#ffffff; --accent-soft:#dcefe4;
  --ok:#1f7a52; --warn:#b26b00; --warn-soft:#fbefd9; --bad:#c23b2b; --bad-soft:#fbe3df;
  --f-display:"Sora",system-ui,sans-serif; --f-body:"Figtree",system-ui,sans-serif; --f-num:"JetBrains Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1511; --surface:#15201a; --surface-2:#1b2821; --line:#26362d;
  --fg:#e3ece6; --muted:#93a89b; --side:#091009; --side-fg:#cfe0d5; --side-muted:#6f8a7a;
  --accent:#4cc28a; --accent-fg:#06140c; --accent-soft:#173426;
  --ok:#4cc28a; --warn:#e8a542; --warn-soft:#33270f; --bad:#f07563; --bad-soft:#3a1a16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1511; --surface:#15201a; --surface-2:#1b2821; --line:#26362d;
  --fg:#e3ece6; --muted:#93a89b; --side:#091009; --side-fg:#cfe0d5; --side-muted:#6f8a7a;
  --accent:#4cc28a; --accent-fg:#06140c; --accent-soft:#173426;
  --ok:#4cc28a; --warn:#e8a542; --warn-soft:#33270f; --bad:#f07563; --bad-soft:#3a1a16; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
aside{background:var(--side);color:var(--side-fg);padding-block:20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;color:#fff;padding:4px 10px 18px;display:flex;gap:8px;align-items:center}
.brand i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-style:normal;font-size:14px}
.navlbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:14px 10px 6px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;color:var(--side-fg);text-decoration:none;font-weight:500}
nav a:hover{background:rgba(255,255,255,.06)}
nav a.on{background:rgba(76,194,138,.16);color:#fff}
nav a .cnt{font-family:var(--f-num);font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
main{min-width:0;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-family:var(--f-display);font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance;flex:1}
.menu-btn{display:none}
.wrap{max-width:1240px;margin:0 auto}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.danger{color:var(--bad);border-color:var(--bad-soft)}
button.sm,.btn.sm{padding:4px 10px;font-size:13px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{color:var(--muted);font-size:13px}
.kpi.bad{background:var(--bad-soft);border-color:transparent}.kpi.bad .v{color:var(--bad)}
.kpi.link{cursor:pointer}.kpi.link:hover{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>header h2{font-family:var(--f-display);font-size:15px;margin:0;font-weight:600}
.panel .body{padding:16px}
.muted{color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
.num{text-align:right;font-family:var(--f-num);font-size:13px;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{flex:1;min-width:180px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font-weight:500}.tabs button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:16px;margin-bottom:4px}
.ex{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:0 5px;margin-left:6px}
.banner{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-weight:500}
/* gaveta / modal */
.scrim{position:fixed;inset:0;background:rgba(5,12,8,.5);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(980px,100%);height:100%;overflow:auto;padding-block:max(20px,env(safe-area-inset-top,0px)) 40px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.drawer h2{font-family:var(--f-display);margin:0;font-size:20px;text-wrap:balance}
.drawer .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;width:min(520px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal h3{font-family:var(--f-display);margin:0;font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 18px}
.dl div span{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dl div b{font-weight:600;font-variant-numeric:tabular-nums}
.calc{background:var(--surface-2);border-radius:8px;padding:12px 14px;display:grid;gap:4px;font-variant-numeric:tabular-nums}
.calc div{display:flex;justify-content:space-between;gap:10px}
.calc .t{font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-weight:600}
.msgbox{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:12px;font-size:13px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;inset:0 auto 0 0;width:250px;z-index:50;transform:translateX(-100%);transition:transform .2s;padding-top:max(20px,env(safe-area-inset-top,0px))}
  aside.open{transform:none}
  .menu-btn{display:inline-flex}
  .form{grid-template-columns:minmax(0,1fr)}
  .kpi .v{font-size:20px}
  /* modo celular: barra do topo fixa, campos sem zoom automático do iPhone, tabelas viram cartões */
  .top{position:sticky;top:0;z-index:30;background:var(--bg);margin:-20px -16px 14px;padding:10px 16px;border-bottom:1px solid var(--line)}
  .top h1{font-size:18px}
  input,select,textarea{font-size:16px}
  button,.btn{padding:10px 14px}
  button.sm,.btn.sm{padding:8px 12px}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl thead{display:none}
  .tbl tr{padding:10px 14px;border-bottom:1px solid var(--line)}
  .tbl tr:last-child{border-bottom:0}
  .tbl td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:3px 0;text-align:right;white-space:normal}
  .tbl td::before{content:attr(data-l);font-family:var(--f-body);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;flex:none}
  .tbl td:first-child{font-size:15px;text-align:left}
  .tbl td:first-child::before{display:none}
  .tbl td:not([data-l]){justify-content:flex-end}
  .tbl td .row{justify-content:flex-end}
  .drawer{padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .drawer .kpis{grid-template-columns:minmax(0,1fr)!important}
  .modal{padding:16px}
}
@media (max-width:420px){.kpis{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
[hidden]{display:none!important}
.falta{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.alerta-form{background:var(--bad-soft);color:var(--bad);padding:10px 14px;border-radius:8px;font-weight:600}
.grp td{background:var(--surface-2);padding-top:12px}
.tbl tr.grp:hover td{background:var(--surface-2)}
.semBaixa [data-act="pagar"]{display:none!important}
.metabar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}.metabar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.metabar.ok i{background:var(--ok)}.so-print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--surface:#fff;--surface-2:#eef2ee;--line:#d5ddd6;--fg:#17221c;--muted:#5d6b62;--accent:#1f7a52;--ok:#1f7a52;--bad:#c23b2b;--warn:#b26b00;color-scheme:light}
  body{background:#fff;font-size:11px}
  .app{display:block}aside,#menuBtn,#topActions,#banner,.toolbar,.noprint,.toast{display:none!important}
  .wrap{padding:0!important;max-width:none!important}.top{margin:0 0 6px}
  .so-print{display:block}.panel,.kpi{break-inside:avoid;box-shadow:none!important}
  .tbl{overflow:visible!important}table{font-size:9.5px}th,td{padding:4px 6px!important}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  tr.click{cursor:default}
}

<script>
(function(){
"use strict";
const S={clientes:[],contratos:[],transacoes:[],config:{},avisos:[],lemb:{},loaded:{}};
let db=null, canWrite=true, view="dashboard", sub={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money=v=>BRL.format(+v||0);
const r2=v=>Math.round((+v||0)*100)/100;
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>iso(new Date());
const fdate=s=>s?parse(s).toLocaleDateString("pt-BR"):"—";
const days=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const PER={mensal:"Mensal",quinzenal:"Quinzenal",semanal:"Semanal",diaria:"Diária"};
const MOD={saldo:"Saldo devedor (juros por dia)",simples:"Parcelado (juros simples)",price:"Price (juros compostos)",juros:"Só juros + principal no fim"};
const isSaldo=c=>!!c&&c.modalidade==="saldo";
// Quem está usando (no servidor próprio). Operador: vê e altera só a própria rota, lança contrato que fica aguardando
// o Pix do administrador e só registra recebimento se o administrador liberar em Configurações.
const eu=()=>window.__ccEu||{papel:"admin",nome:""};
const souAdmin=()=>eu().papel==="admin";
const rotas=()=>String(cfg("rotas")||"").split(",").map(x=>x.trim()).filter(Boolean);
const podeReceber=()=>souAdmin()||!!cfg("operadorRecebe");
// Rota de cada registro. Lançamentos e contratos novos guardam a rota do cliente no momento; os antigos usam a rota atual do cliente.
const rotaCli=id=>cli(id).rota||"";
const rotaDoc=x=>typeof x.rota==="string"?x.rota:x.clienteId?rotaCli(x.clienteId):"";
const daRota=(x,r)=>r==="todas"||(r==="sem rota"?!rotaDoc(x):rotaDoc(x)===r);
const abasRota=()=>({todas:"Todas as rotas",...Object.fromEntries(rotas().map(r=>[r,r])),"sem rota":"Sem rota"});
const meta=(r,k)=>{const m=cfg("metas")||{};return r==="todas"?rotas().reduce((a,x)=>a+(+(m[x]||{})[k]||0),0):+((m[r]||{})[k])||0};
const lerMetas=f=>{const o={};f.querySelectorAll("[data-meta]").forEach(i=>{const v=+i.value;if(v>0)(o[i.dataset.meta]=o[i.dataset.meta]||{})[i.dataset.k]=r2(v)});return o};
const mesNome=m=>{const s=parse(m+"-01").toLocaleDateString("pt-BR",{month:"long",year:"numeric"});return s[0].toUpperCase()+s.slice(1)};
const cfg=k=>{const d={nome:"CrediControle",taxa:20,multa:2,mora:0.33,saldoInicial:0,corteDias:1,msg:"Olá {nome}, tudo bem? Passando para lembrar da parcela {parcela} do seu contrato, no valor de {valor}, com vencimento em {vencimento}. Qualquer dúvida estou à disposição."};return S.config[k]??d[k]};

/* ---------- cálculo ---------- */
/* calculo:inicio — o servidor (calculo.js) usa este trecho nos lembretes do WhatsApp; aqui dentro, só r2, as funções de data, cfg e today */
function vencimento(c,k){ // k = 0-based
  const b=c.primeiroVenc;
  if(c.periodicidade==="quinzenal")return addDays(b,15*k);
  if(c.periodicidade==="semanal")return addDays(b,7*k);
  if(c.periodicidade==="diaria")return addDays(b,k);
  return addMonths(b,k);
}
// Taxa (% por período) que resulta numa parcela de valor p. Devolve null se a parcela não cobre o emprestado.
function taxaDaParcela(mod,V,n,p){
  if(!(V>0)||!(p>0))return null;
  if(mod==="juros")return p/V*100;
  if(p*n<V-0.005)return null;
  if(mod==="simples")return Math.max(0,(p*n/V-1)/n*100);
  let a=0,b=10; // Price: procura a taxa pela metade do intervalo (0% a 1000%)
  for(let k=0;k<80;k++){const m=(a+b)/2,pm=m>0?V*m/(1-Math.pow(1+m,-n)):V/n;if(pm>p)b=m;else a=m}
  return a*100;
}
function gerarParcelas(c){
  const V=+c.valor,i=(+c.taxa)/100,n=Math.max(1,parseInt(c.nParcelas)||1),out=[];
  let vals=[];
  const fixa=+c.parcelaFixa>0?r2(c.parcelaFixa):0; // valor da parcela digitado no contrato (a taxa foi calculada a partir dele)
  if(c.modalidade==="price"){const p=i>0?V*i/(1-Math.pow(1+i,-n)):V/n;vals=Array(n).fill(fixa||r2(p));}
  else if(c.modalidade==="juros"){const j=fixa||r2(V*i);vals=Array(n).fill(j);vals[n-1]=r2(j+V);}
  else if(fixa)vals=Array(n).fill(fixa);
  else{const tot=r2(V*(1+i*n)),p=r2(tot/n);vals=Array(n).fill(p);vals[n-1]=r2(tot-p*(n-1));}
  for(let k=0;k<n;k++)out.push({n:k+1,venc:vencimento(c,k),valor:vals[k],pagamentos:[]});
  return out;
}
const pagoP=p=>r2((p.pagamentos||[]).reduce((a,x)=>a+(+x.valor||0),0));
function encargos(p,c,ref){
  ref=ref||today();
  const atraso=Math.max(0,days(p.venc,ref));
  const multa=atraso>0?r2(p.valor*(+(c.multa??cfg("multa")))/100):0;
  const mora=atraso>0?r2(p.valor*(+(c.mora??cfg("mora")))/100*atraso):0;
  const total=r2(p.valor+multa+mora), pago=pagoP(p);
  return {atraso,multa,mora,total,pago,devido:Math.max(0,r2(total-pago))};
}
const quitadaP=p=>!!p.quitada;
// Capital previsto de cada parcela (amortização), como na planilha do cliente:
// Price: tabela Price (a amortização cresce a cada parcela e os juros caem); só juros: todo o capital na última;
// juros simples: capital igual em todas. Mais o capital que ficou faltando de uma parcela paga a menor e foi somado nesta.
function amortBase(c,n){const ps=c.parcelas||[],N=ps.length,V=+c.valor||0,i=(+c.taxa||0)/100;if(!N)return 0;
  const a=k=>c.modalidade==="price"&&i>0?r2(V*i/(Math.pow(1+i,N)-1)*Math.pow(1+i,k-1)):c.modalidade==="juros"?(k===N?V:0):r2(V/N);
  if(n<N)return a(n);let s=0;for(let k=1;k<N;k++)s+=a(k);return r2(V-s)} // a última fecha o valor emprestado, sem sobra de centavos
function capPrev(c,p){const extra=(p.acrescimos||[]).reduce((a,x)=>a+(+x.capital||0),0);return Math.max(0,Math.min(+p.valor||0,r2(amortBase(c,p.n)+extra)))}
// capital que ainda falta receber nesta parcela (descontado o capital de pagamentos parciais já lançados)
function capFalta(c,p){return Math.max(0,r2(capPrev(c,p)-(p.pagamentos||[]).reduce((a,g)=>a+divPag(c,p,g).capital,0)))}
// juros de um pagamento sem divisão lançada (pagamentos antigos): o capital previsto vai primeiro, o resto é juros.
// Sem parcela (lançamento solto), a proporção do contrato.
function jurosAuto(c,p,v,antes=0){
  if(!p){const tot=(c.parcelas||[]).reduce((a,q)=>a+(+q.valor||0),0);return tot>0?r2(v*Math.max(0,tot-(+c.valor||0))/tot):0}
  return r2(v-Math.max(0,Math.min(v,r2(capPrev(c,p)-antes))))}
function divPag(c,p,g){const v=+g.valor||0;if(g.juros!=null&&g.capital!=null)return {juros:+g.juros,capital:+g.capital};
  const ps=p?(p.pagamentos||[]):[],k=ps.indexOf(g),antes=k>0?ps.slice(0,k).reduce((a,x)=>a+divPag(c,p,x).capital,0):0;
  const j=jurosAuto(c,p,v,antes);return {juros:j,capital:r2(v-j)}}
// todos os pagamentos de um contrato, com juros e capital separados
function pagsDe(c){
  if(isSaldo(c))return extrato(c).linhas.filter(l=>l.mov).map(l=>({data:l.data,valor:l.valor,juros:l.pj,capital:l.cap,ref:"Pagamento",forma:l.mov.forma||""}));
  return (c.parcelas||[]).flatMap(p=>(p.pagamentos||[]).map(g=>({data:g.data,valor:+g.valor,...divPag(c,p,g),ref:`Parcela ${p.n}/${c.parcelas.length}`,forma:g.forma||""})));
}
function resumoPags(c){const ps=pagsDe(c),capital=r2(ps.reduce((a,x)=>a+x.capital,0));
  return {ps,pago:r2(ps.reduce((a,x)=>a+x.valor,0)),juros:r2(ps.reduce((a,x)=>a+x.juros,0)),capital,capAberto:isSaldo(c)?extrato(c).saldoBase:Math.max(0,r2((+c.valor||0)-capital))}}
/* saldo:inicio — modalidade "saldo devedor": juros simples por dia corrido (taxa mensal ÷ 30) sobre o saldo,
   desde a última movimentação; cada pagamento quita primeiro os juros do período e o resto abate o saldo.
   Juros não pagos ficam no saldo e passam a render juros no movimento seguinte. */
// O extrato de um contrato numa data é pedido muitas vezes a cada redesenho da tela; fica guardado por contrato.
// Os objetos de contrato são trocados por novos a cada mudança (nunca alterados no lugar), então o guardado se renova.
const extratos=new WeakMap();
function extrato(c,ref){
  ref=ref||today();
  let m=extratos.get(c);if(!m)extratos.set(c,m=new Map());
  if(!m.has(ref))m.set(ref,calculaExtrato(c,ref));
  return m.get(ref);
}
function calculaExtrato(c,ref){
  const td=(+c.taxa)/100/30;
  const movs=[...(c.movimentos||[])].sort((a,b)=>a.data.localeCompare(b.data)||String(a.criadoEm||"").localeCompare(String(b.criadoEm||"")));
  let saldo=r2(c.valor),ult=c.dataContrato,pago=0,jurosPagos=0,capitalPago=0,perdoado=0;
  const linhas=[{data:c.dataContrato,tipo:"emprestimo",dias:0,juros:0,valor:r2(c.valor),saldo}];
  for(const m of movs){
    const dias=Math.max(0,days(ult,m.data)),juros=r2(saldo*td*dias),v=r2(m.valor);
    // pagamento comum: quita primeiro os juros. Com a divisão escolhida (m.manual): o que foi para capital abate o saldo,
    // os juros do período que faltaram ficam no saldo, a não ser que tenham sido perdoados (m.perdao).
    const pj=m.manual?r2(+m.juros||0):Math.min(v,juros),cap=r2(v-pj),falta=r2(Math.max(0,juros-pj)),perd=m.manual?Math.min(falta,r2(+m.perdao||0)):0;
    saldo=r2(saldo-cap+falta-perd);pago=r2(pago+v);jurosPagos=r2(jurosPagos+pj);capitalPago=r2(capitalPago+cap);perdoado=r2(perdoado+perd);ult=m.data;
    linhas.push({data:m.data,tipo:"pagamento",dias,juros,valor:v,saldo,mov:m,pj,cap,perd});
  }
  const quitado=movs.length>0&&saldo<=0.009;
  const diasHoje=quitado?0:Math.max(0,days(ult,ref)),jurosHoje=quitado?0:r2(saldo*td*diasHoje);
  return {linhas,saldoBase:Math.max(0,saldo),ultima:ult,diasHoje,jurosHoje,saldoHoje:quitado?0:r2(saldo+jurosHoje),pago,jurosPagos,capitalPago,perdoado,quitado,taxaDia:td};
}

function statusC(c){
  if(c.cancelado)return "cancelado";
  if(c.pendente)return "pendente"; // lançado pelo operador, aguardando o administrador confirmar o Pix
  if(isSaldo(c))return extrato(c).quitado?"quitado":c.vencimento<today()?"atrasado":"ativo";
  const ps=c.parcelas||[];
  if(ps.length&&ps.every(quitadaP))return "quitado";
  const t=today();
  if(ps.some(p=>!quitadaP(p)&&p.venc<t))return "atrasado";
  return "ativo";
}
const STP={pendente:["Aguardando Pix","warn"],ativo:["Em dia","ok"],atrasado:["Em atraso","bad"],quitado:["Quitado",""],cancelado:["Cancelado",""]};
const pillC=c=>{const [t,k]=STP[statusC(c)];return `<span class="pill ${k}">${t}</span>`};
// Índice de clientes por id, refeito só quando a lista muda (as listas procuram o cliente de cada linha).
let cliIdx={l:null,m:null};
const cli=id=>{if(cliIdx.l!==S.clientes)cliIdx={l:S.clientes,m:new Map(S.clientes.map(x=>[x.id,x]))};return cliIdx.m.get(id)||{nome:"(cliente removido)"}};
const ex=o=>o&&o.exemplo?'<span class="ex">exemplo</span>':"";
let abMemo={}; // a lista de parcelas em aberto é pedida várias vezes por redesenho: vale até contratos, config ou o dia mudarem
function abertas(){ // todas as parcelas em aberto com contexto (quem usa não altera a lista devolvida)
  const out=[],t=today();
  if(abMemo.c===S.contratos&&abMemo.g===S.config&&abMemo.t===t)return abMemo.v;
  abMemo={c:S.contratos,g:S.config,t,v:out};
  for(const c of S.contratos){if(c.cancelado||c.pendente)continue;
    if(isSaldo(c)){ // uma "parcela" só: o saldo de hoje; a receber no vencimento = saldo com os juros até lá
      const x=extrato(c);if(x.quitado)continue;
      const v=c.vencimento,atraso=Math.max(0,days(v,t)),devido=v>t?r2(x.saldoBase*(1+x.taxaDia*Math.max(0,days(x.ultima,v)))):x.saldoHoje;
      out.push({c,p:{n:1,venc:v,valor:x.saldoHoje},e:{atraso,multa:0,mora:0,total:devido,pago:0,devido}});continue}
    for(const p of c.parcelas||[])if(!quitadaP(p))out.push({c,p,e:encargos(p,c)});}
  return out;
}

/* ---------- banco ---------- */
async function boot(){
  try{
    db=await window.claude?.use?.("db");
    const user=await window.claude?.use?.("user");
    if(user){const w=await user.can("data.write");if(w===false)canWrite=false;}
  }catch(e){db=null}
  if(!db){$("#view").innerHTML='<div class="empty"><b>Não foi possível abrir o banco de dados</b>Entre na sua conta do claude.ai e abra este link novamente.</div>';return}
  for(const col of ["clientes","contratos","transacoes"]){
    db.collection(col).limit(1000).onSnapshot(s=>{S[col]=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded[col]=1;render()},err);
  }
  db.doc("config/geral").onSnapshot(s=>{S.config=s.exists?s.data():{};S.loaded.config=1;render()},err);
  // lembretes: dias de aviso (config/lembretes) e quem já foi avisado (avisos)
  db.doc("config/lembretes").onSnapshot(s=>{S.lemb=s.exists?s.data():{};render()},err);
  db.collection("avisos").limit(1000).onSnapshot(s=>{S.avisos=s.docs.map(d=>({id:d.id,...d.data()}));render()},err);
}
function err(e){toast("Erro no banco de dados: "+(e&&e.message||e))}
async function put(col,obj){
  if(!canWrite){toast("Você tem acesso só de leitura.");throw new Error("ro")}
  const {id,...rest}=obj;await db.doc(col+"/"+id).set(rest);
}
async function upd(col,id,data){if(!canWrite){toast("Você tem acesso só de leitura.");throw new Error("ro")}await db.doc(col+"/"+id).update(data)}
async function del(col,id){if(!canWrite){toast("Você tem acesso só de leitura.");throw new Error("ro")}await db.doc(col+"/"+id).delete()}
// Gravações que só fazem sentido juntas (pagamento no contrato + lançamento no caixa). No servidor próprio entram
// todas ou nenhuma; onde isso não existe, vão uma por uma. ops = [{op:"gravar"|"mesclar"|"excluir",col,id,dados}]
async function gravaJuntos(ops){
  if(!canWrite){toast("Você tem acesso só de leitura.");throw new Error("ro")}
  if(db.lote)return db.lote(ops);
  for(const o of ops){const d=db.doc(o.col+"/"+o.id);await(o.op==="gravar"?d.set(o.dados):o.op==="mesclar"?d.update(o.dados):d.delete())}
}

/* ---------- gráficos ---------- */
function bars(data,{h=200,color="var(--accent)",lblEvery=1}={}){
  const W=640,H=h,L=70,R=10,T=12,B=26,max=Math.max(1,...data.map(d=>d.v));
  const step=niceStep(max/4),top=Math.ceil(max/step)*step||1;
  const bw=(W-L-R)/data.length;let g="";
  for(let y=0;y<=top+1e-9;y+=step){const py=T+(H-T-B)*(1-y/top);g+=`<line x1="${L}" x2="${W-R}" y1="${py}" y2="${py}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${py+4}" text-anchor="end">${short(y)}</text>`}
  data.forEach((d,i)=>{const bh=(H-T-B)*(d.v/top),x=L+i*bw+bw*.18,y=H-B-bh;
    g+=`<rect x="${x}" y="${y}" width="${bw*.64}" height="${Math.max(0,bh)}" rx="2" fill="${d.hi?"var(--fg)":color}"><title>${esc(d.t)}: ${money(d.v)}</title></rect>`;
    if(i%lblEvery===0||i===data.length-1)g+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${esc(d.l)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function niceStep(x){if(x<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(x))),m=x/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}
const short=v=>v>=1e6?"R$ "+(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi":v>=1e3?"R$ "+(v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":"R$ "+Math.round(v);

// Total pago e juros do contrato (os já pagos mais os que estão correndo hoje, nos contratos de saldo devedor).
function pagoEJuros(c){
  if(c.pendente)return {pago:0,juros:0};
  if(isSaldo(c)){const x=extrato(c);return {pago:x.pago,juros:r2(x.jurosPagos+x.jurosHoje)}}
  const ps=c.parcelas||[];return {pago:r2(ps.reduce((a,p)=>a+pagoP(p),0)),juros:r2(ps.reduce((a,p)=>a+p.valor,0)-(+c.valor||0))};
}
// Aba Geral: contratos agrupados pelo vencimento da próxima parcela em aberto (as mesmas faixas da tela de Cobranças).
// Quitados e cancelados vão para o fim, fechados até a pessoa clicar no título.
const ORDEM_G=["atrasado","hoje","semana","mes","adiante","pendente","quitado","cancelado"],
  NOME_G={atrasado:"Atrasados",hoje:"Vencem hoje",semana:"Próximos 7 dias",mes:"Restante do mês",adiante:"Mais adiante",pendente:"Aguardando Pix",quitado:"Quitados",cancelado:"Cancelados"},
  FECHA_G=["quitado","cancelado"];
function proxVencs(){const m={};for(const x of abertas())if(!m[x.c.id]||x.p.venc<m[x.c.id].p.venc)m[x.c.id]=x;return m}
function grupoC(c,px,t){const s=statusC(c);if(["cancelado","quitado","pendente"].includes(s))return s;
  const x=px[c.id];if(!x)return "adiante";const v=x.p.venc;
  return v<t?"atrasado":v===t?"hoje":v<=addDays(t,7)?"semana":v.slice(0,7)===t.slice(0,7)?"mes":"adiante"}
function conRows(list,agrupar){
  if(!list.length)return `<div class="empty"><b>Nenhum contrato aqui</b>Use “Novo contrato” para registrar um empréstimo.</div>`;

  if(agrupar){for(const c of list){const k=g(c);cont[k]=(cont[k]||0)+1}
    list=[...list].sort((a,b)=>ORDEM_G.indexOf(g(a))-ORDEM_G.indexOf(g(b))||(px[a.id]?.p.venc||"9").localeCompare(px[b.id]?.p.venc||"9")||(b.dataContrato||"").localeCompare(a.dataContrato||""))}
  const fechado=k=>ui.conAbre!==k;
  const cab=k=>{const f=agrupar&&FECHA_G.includes(k);return `<tr class="grp${f?" click":""}"${f?` data-act="tab" data-k="conAbre" data-v="${fechado(k)?k:""}"`:""}><td colspan="11"><b>${NOME_G[k]} (${cont[k]})</b>${f?` <span class="muted">${fechado(k)?"▸ mostrar":"▾ esconder"}</span>`:""}</td></tr>`};
  let ult=null;
  const linha=c=>{const ps=c.parcelas||[],pj=pagoEJuros(c),x=px[c.id],k=agrupar?g(c):null;
    const grupo=agrupar&&k!==ult?(ult=k,cab(k)):"";
    return grupo+`<tr class="click" data-act="verContrato" data-id="${c.id}"><td><b>${esc(cli(c.clienteId).nome)}</b>${ex(c)}</td><td>${x?`${fdate(x.p.venc)}<div class="muted">${money(x.e.devido)}${x.e.atraso?` · <span style="color:var(--bad)">${x.e.atraso} dias</span>`:""}</div>`:'<span class="muted">—</span>'}</td><td>${fdate(c.dataContrato)}</td><td>${MOD[c.modalidade]||""}<div class="muted">${isSaldo(c)?"vence "+fdate(c.vencimento):PER[c.periodicidade]}</div></td><td class="num">${money(c.valor)}</td><td class="num">${(+c.taxa).toLocaleString("pt-BR")}%${isSaldo(c)?" a.m.":""}</td><td class="num">${isSaldo(c)?(c.movimentos||[]).length+" pgto":ps.filter(quitadaP).length+"/"+ps.length}</td><td class="num">${money(pj.pago)}</td><td class="num">${money(pj.juros)}</td><td class="num"><b>${money(saldoContrato(c))}</b></td><td>${pillC(c)}${c.inad&&!["quitado","cancelado"].includes(statusC(c))?' <span class="pill bad">Inadimplente</span>':""}</td></tr>`};
  const {vis,resto}=corta(agrupar?list.filter(c=>!FECHA_G.includes(g(c))):list,"conMax");
  const fim=agrupar?FECHA_G.filter(k=>cont[k]).map(k=>fechado(k)?cab(k):list.filter(c=>g(c)===k).map(linha).join("")).join(""):"";
  return `<div class="tbl"><table><thead><tr><th>Cliente</th><th>Próx. vencimento</th><th>Início</th><th>Modalidade</th><th class="num">Emprestado</th><th class="num">Taxa</th><th class="num">Pagas</th><th class="num">Pago</th><th class="num">Juros</th><th class="num">Saldo hoje</th><th>Situação</th></tr></thead><tbody>${vis.map(linha).join("")}${fim}</tbody></table></div>${resto}`;
}

// Lembretes de hoje: o que vence nos dias configurados (padrão: amanhã e hoje). "Abrir conversa" abre o WhatsApp de
// quem está usando (celular ou WhatsApp Web) com a mensagem pronta, e marca o cliente como avisado.
const diasLemb=()=>Array.isArray(S.lemb.dias)&&S.lemb.dias.length?S.lemb.dias:[1,0];
const telWa=t=>{const d=String(t||"").replace(/\D/g,"");return d.length===10||d.length===11?"55"+d:/^55\d{10,11}$/.test(d)?d:""};
function lembretesHoje(){
  const t=today(),ds=diasLemb(),av=new Map(S.avisos.map(a=>[a.id,a]));
  return abertas().map(x=>({...x,falta:days(t,x.p.venc)})).filter(x=>ds.includes(x.falta)).map(x=>{
    const cl=cli(x.c.clienteId),id=[x.c.id,isSaldo(x.c)?"saldo":x.p.n,x.p.venc,x.falta].join("_"),tel=telWa(cl.telefone),aviso=av.get(id);
    return {...x,cl,id,tel,aviso,situacao:aviso?"avisado":cl.semLembrete?"recusa":!tel?"semtel":"avisar"};
  }).sort((a,b)=>a.falta-b.falta||String(a.cl.nome).localeCompare(String(b.cl.nome)));
}
const textoLembrete=x=>cfg("msg").replace(/\{nome\}/g,(x.cl.nome||"").split(" ")[0]).replace(/\{parcela\}/g,isSaldo(x.c)?"única":`${x.p.n}/${x.c.parcelas.length}`).replace(/\{valor\}/g,money(x.e.devido)).replace(/\{vencimento\}/g,fdate(x.p.venc)).replace(/\{atraso\}/g,x.e.atraso+" dias");
const quandoVence=f=>f>1?`em ${f} dias`:f===1?"amanhã":f===0?"hoje":`${-f} dia${f<-1?"s":""} de atraso`;
function viewLembretes(){
  const l=lembretesHoje(),feitos=l.filter(x=>x.situacao==="avisado").length;
  const acao=x=>{const link=`https://wa.me/${x.tel}?text=${encodeURIComponent(textoLembrete(x))}`;
    if(x.situacao==="avisado")return `<span class="pill ok">Avisado</span> <span class="muted">${esc(x.aviso.por||"")} ${new Date(x.aviso.quando).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</span> <a class="btn sm" href="${link}" target="_blank" rel="noopener">Abrir de novo</a>`;
    if(x.situacao==="recusa")return '<span class="pill">Não quer receber</span>';

  return `<p class="muted" style="margin-top:0">O botão abre a conversa no seu WhatsApp (celular ou WhatsApp Web) com a mensagem pronta: é só conferir e enviar. O texto é o de Configurações → Mensagem de cobrança. <b>${feitos} de ${l.length}</b> já avisados hoje.</p>
  <section class="panel">${l.length?`<div class="tbl"><table><thead><tr><th>Cliente</th><th>Vencimento</th><th>Telefone</th><th class="num">Valor</th><th></th></tr></thead><tbody>${l.map(x=>`<tr><td><b>${esc(x.cl.nome)}</b>${ex(x.c)}</td><td>${fdate(x.p.venc)} <span class="muted">${quandoVence(x.falta)}</span></td><td>${esc(x.cl.telefone||"—")}</td><td class="num">${money(x.e.devido)}</td><td><div class="row">${acao(x)}</div></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty"><b>Ninguém para avisar hoje</b>Aparecem aqui os vencimentos de ${diasLemb().map(quandoVence).join(" e ")}.</div>`}</section>`;
}

const somaTipo=(l,t)=>r2(l.filter(x=>x.tipo===t).reduce((a,x)=>a+(+x.valor||0),0));

/* ---------- período (mês, padrão, ou datas escolhidas) ---------- */
const fimMes=m=>{const [y,mm]=m.split("-").map(Number);return iso(new Date(y,mm,0))};
function periodo(){const p=ui.per;if(p.tipo==="periodo"&&p.de&&p.ate&&p.de<=p.ate)return {de:p.de,ate:p.ate,nome:fdate(p.de)+" a "+fdate(p.ate)};const m=p.mes||today().slice(0,7);return {de:m+"-01",ate:fimMes(m),nome:mesNome(m)}}
const noPer=(d,P)=>!!d&&d>=P.de&&d<=P.ate;
// quantos "meses" o período vale, para as metas mensais: soma, mês a mês, dos dias do período ÷ dias do mês
function fatorMeses(P){let f=0,d=P.de;while(d<=P.ate){const fm=fimMes(d.slice(0,7)),ate=fm<P.ate?fm:P.ate;f+=(days(d,ate)+1)/+fm.slice(8);d=addDays(fm,1)}return f}
const fmtMeses=f=>{const x=Math.round(f*100)/100;return x===1?"1 mês":x.toLocaleString("pt-BR")+" meses"};
function seletorPeriodo(){const p=ui.per,lbl='class="f" style="flex-direction:row;align-items:center;gap:6px"';
  return `<label ${lbl}>Período <select id="perTipo" style="width:auto"><option value="mes" ${p.tipo!=="periodo"?"selected":""}>Mês</option><option value="periodo" ${p.tipo==="periodo"?"selected":""}>Escolher datas</option></select></label>${p.tipo==="periodo"?`<label ${lbl}>de <input type="date" id="perDe" value="${p.de||""}" style="width:auto"></label><label ${lbl}>até <input type="date" id="perAte" value="${p.ate||""}" style="width:auto"></label>`:`<input type="month" id="perMes" value="${p.mes}" style="width:auto">`}<span class="row" style="gap:6px">${[["mesAtual","Este mês"],["mesPassado","Mês passado"],["ano","Este ano"]].map(([k,l])=>`<button class="sm" data-act="perAtalho" data-v="${k}">${l}</button>`).join("")}</span>`}
const saldoAte=(R,d)=>{const l=S.transacoes.filter(x=>daRota(x,R)&&(x.data||"")<=d);return r2((R==="todas"?+cfg("saldoInicial")||0:0)+somaTipo(l,"entrada")-somaTipo(l,"saida"))};
const rotasComDados=(abas,temDados)=>Object.keys(abas).filter(k=>k!=="todas"&&(k!=="sem rota"||temDados(k)));

/* ---------- caixa ---------- */
VIEWS.caixa=()=>{
  const abas=abasRota();if(!abas[ui.cxRota])ui.cxRota="todas";
  const R=ui.cxRota,todas=R==="todas",P=periodo();
  const doPer=S.transacoes.filter(x=>noPer(x.data,P)),l=doPer.filter(x=>daRota(x,R)).sort((a,b)=>(b.data+b.criadoEm).localeCompare(a.data+a.criadoEm));
  const me=somaTipo(l,"entrada"),ms=somaTipo(l,"saida");
  // fechamento do período: saldo anterior, entradas, saídas e saldo final de cada rota
  const linhaF=k=>{const q=doPer.filter(x=>daRota(x,k)),e=somaTipo(q,"entrada"),s=somaTipo(q,"saida"),a=saldoAte(k,addDays(P.de,-1));return {k,n:abasRota()[k],a,e,s,f:r2(a+e-s),q:q.length}};
  const fech=todas?rotasComDados(abas,k=>S.transacoes.some(x=>daRota(x,k))).map(linhaF):[],tot=todas?linhaF("todas"):null;
  return `<div class="toolbar"><div class="tabs">${tabs("cxRota",abas)}</div></div>
  <div class="toolbar">${seletorPeriodo()}<button class="sm" data-act="relDoCaixa" style="margin-left:auto">Relatório de fechamento em PDF</button></div>
  <div class="kpis">${kpi(todas?"Saldo em caixa hoje":"Saldo da rota hoje",money(saldoAte(R,"9999-12-31")),todas?"saldo inicial + entradas − saídas":"entradas − saídas desta rota, desde o início")}${kpi("Entradas no período",money(me),l.filter(x=>x.tipo==="entrada").length+" lançamentos")}${kpi("Saídas no período",money(ms),l.filter(x=>x.tipo==="saida").length+" lançamentos")}${kpi("Resultado do período",money(me-ms),P.nome,me-ms<0?"bad":"")}</div>
  ${fech.length?`<section class="panel" style="margin-bottom:14px"><header><h2>Fechamento por rota</h2><span class="muted">${P.nome}</span></header><div class="tbl"><table><thead><tr><th>Rota</th><th class="num">Saldo anterior</th><th class="num">Entradas</th><th class="num">Saídas</th><th class="num">Resultado</th><th class="num">Saldo final</th></tr></thead><tbody>${fech.map(x=>`<tr class="click" data-act="tab" data-k="cxRota" data-v="${esc(x.k)}"><td><b>${esc(x.n)}</b></td><td class="num">${money(x.a)}</td><td class="num" style="color:var(--ok)">${money(x.e)}</td><td class="num" style="color:var(--bad)">${money(x.s)}</td><td class="num"><b>${money(x.e-x.s)}</b></td><td class="num">${money(x.f)}</td></tr>`).join("")}<tr><td><b>Total</b><div class="muted" style="font-size:12px">inclui o saldo inicial do caixa</div></td><td class="num"><b>${money(tot.a)}</b></td><td class="num"><b>${money(tot.e)}</b></td><td class="num"><b>${money(tot.s)}</b></td><td class="num"><b>${money(tot.e-tot.s)}</b></td><td class="num"><b>${money(tot.f)}</b></td></tr></tbody></table></div></section>`:""}
  <section class="panel">${l.length?`<div class="tbl"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Rota</th><th>Forma</th><th class="num">Valor</th><th></th></tr></thead><tbody>${l.map(x=>`<tr><td>${fdate(x.data)}</td><td>${esc(x.descricao)}${ex(x)}</td><td>${esc(x.categoria||"—")}</td><td>${esc(rotaDoc(x)||"—")}</td><td>${esc(x.forma||"—")}</td><td class="num" style="color:var(${x.tipo==="entrada"?"--ok":"--bad"})">${x.tipo==="entrada"?"+":"−"} ${money(x.valor)}</td><td>${x.contratoId?`<button class="sm" data-act="verContrato" data-id="${x.contratoId}">Contrato</button>`:`<button class="sm danger" data-act="delLanc" data-id="${x.id}">Excluir</button>`}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty"><b>Sem lançamentos neste período</b>Empréstimos concedidos e pagamentos recebidos entram aqui automaticamente. Despesas e aportes você lança em “Novo lançamento”.</div>`}</section>`;
};

/* ---------- relatórios ---------- */
// Responsável por um contrato (metas por operador): quem lançou. Contratos antigos, sem esse registro, ficam com o
// operador da rota do cliente quando a rota tem um operador só.
const usuariosL=()=>S.usuarios||[];
function respDe(c){if(c.criadoPor!=null)return String(c.criadoPor);const r=rotaDoc(c),ops=usuariosL().filter(u=>u.papel==="operador"&&u.ativo&&u.rota&&u.rota===r);return ops.length===1?String(ops[0].id):""}
const nomeResp=(id,c)=>{const u=usuariosL().find(x=>String(x.id)===id);return u?u.nome:id?(c&&c.criadoPorNome)||"Usuário "+id:"Sem responsável"};
const conId=id=>S.contratos.find(k=>k.id===id);
// juros dentro de uma parcela recebida: a parte dos juros no total do contrato parcelado
// multa e mora (o que passa do valor da parcela) também são juros
function jurosDaParcela(x){const k=conId(x.contratoId);if(!k||isSaldo(k))return 0;
  const p=(k.parcelas||[]).find(q=>(q.pagamentos||[]).some(g=>g.txId===x.id)),g=p&&p.pagamentos.find(g=>g.txId===x.id);
  return g?divPag(k,p,g).juros:jurosAuto(k,null,+x.valor||0)}
function numsRel(R,P){
  const cons=S.contratos.filter(c=>!c.cancelado&&!c.pendente&&daRota(c,R));
  const novos=cons.filter(c=>noPer(c.dataContrato,P)).sort((a,b)=>a.dataContrato.localeCompare(b.dataContrato));

  const rec=tx.filter(x=>x.tipo==="entrada"&&x.contratoId).sort((a,b)=>a.data.localeCompare(b.data));
  const cat=k=>soma(rec.filter(x=>x.categoria===k),x=>x.valor);
  const outros=tx.filter(x=>!x.contratoId).sort((a,b)=>a.data.localeCompare(b.data));
  const desp=somaTipo(outros,"saida"),outrasEnt=somaTipo(outros,"entrada");
  const juros=cat("Pagamento de juros"),capital=cat("Pagamento de capital"),parcelas=cat("Recebimento de parcela");
  const jurosParc=soma(rec.filter(x=>x.categoria==="Recebimento de parcela"),jurosDaParcela);
  const descontos=soma(cons.filter(isSaldo).flatMap(c=>(c.movimentos||[]).filter(m=>m.perdao&&noPer(m.data,P))),m=>m.perdao);
  const ab=abertas().filter(x=>daRota(x.c,R)),atr=ab.filter(x=>x.e.atraso>0),ativos=cons.filter(c=>["ativo","atrasado"].includes(statusC(c)));
  const vendas=soma(novos,c=>c.valor),fator=fatorMeses(P);
  return {novos,vendas,rec,juros,capital,parcelas,jurosParc,jurosTot:r2(juros+jurosParc),capitalTot:r2(capital+parcelas-jurosParc),recebido:r2(juros+capital+parcelas),descontos,outros,desp,outrasEnt,
    entradas:somaTipo(tx,"entrada"),saidas:somaTipo(tx,"saida"),ativos:ativos.length,aReceber:soma(ativos,saldoContrato),
    atraso:soma(atr,x=>x.e.devido),nAtraso:new Set(atr.map(x=>x.c.id)).size,nInad:new Set(ab.filter(emInad).map(x=>x.c.clienteId)).size,
    taxaMedia:vendas>0?soma(novos,c=>c.valor*c.taxa)/vendas:0,fator,metaV:r2(meta(R,"vendas")*fator),metaR:r2(meta(R,"recebimento")*fator)};
}
const pct=(v,m)=>m>0?Math.round(v/m*100):null;
const barra=(v,m)=>{const p=pct(v,m);return p===null?'<div class="s">sem meta definida</div>':`<div class="s">${p}% da meta de ${money(m)}</div><div class="metabar ${p>=100?"ok":""}"><i style="width:${Math.min(100,p)}%"></i></div>`};
const celPct=(v,m)=>{const p=pct(v,m);return p===null?'<span class="muted">—</span>':`<b style="color:var(${p>=100?"--ok":p<50?"--bad":"--fg"})">${p}%</b><div class="metabar ${p>=100?"ok":""}" style="min-width:60px"><i style="width:${Math.min(100,p)}%"></i></div>`};
// projeção: no ritmo de hoje, quanto o período fecha (só enquanto o período está em andamento)
function projecao(v,P){const t=today();if(t<P.de||t>=P.ate)return v;return r2(v/(days(P.de,t)+1)*(days(P.de,P.ate)+1))}
const tabela=(cab,linhas,vazio,rodape="")=>linhas.length?`<div class="tbl"><table><thead><tr>${cab.map(h=>`<th${h.startsWith("#")?' class="num"':""}>${h.replace(/^#/,"")}</th>`).join("")}</tr></thead><tbody>${linhas.join("")}${rodape}</tbody></table></div>`:`<div class="empty">${vazio}</div>`;
const painel=(titulo,dir,corpo)=>`<section class="panel" style="margin-bottom:14px"><header><h2>${titulo}</h2><span class="muted">${dir||""}</span></header>${corpo}</section>`;
const REL={resumo:"Resumo",fechamento:"Fechamento de caixa",metas:"Atingimento de metas",carteira:"Carteira e inadimplência",rentabilidade:"Rentabilidade",comparativo:"Comparativo mensal"};

const RELV={};
RELV.resumo=(R,P,abas)=>{const n=numsRel(R,P);
  const porRota=R==="todas"?rotasComDados(abas,k=>S.contratos.some(c=>daRota(c,k))||S.transacoes.some(x=>daRota(x,k))).map(k=>({k,n:abas[k],x:numsRel(k,P)})):[];
  return `<div class="kpis">

    <div class="kpi"><div class="l">Despesas</div><div class="v">${money(n.desp)}</div><div class="s">lançamentos fora de contrato${n.outrasEnt?" · outras entradas "+money(n.outrasEnt):""}</div></div>
    <div class="kpi ${n.entradas-n.saidas<0?"bad":""}"><div class="l">Resultado do caixa</div><div class="v">${money(n.entradas-n.saidas)}</div><div class="s">entradas ${money(n.entradas)} − saídas ${money(n.saidas)}</div></div></div>
  <div class="kpis">${kpi("A receber hoje",money(n.aReceber),n.ativos+(n.ativos===1?" contrato ativo":" contratos ativos"))}${kpi("Em atraso",money(n.atraso),n.nAtraso+" contrato"+(n.nAtraso===1?"":"s"),n.atraso?"bad":"")}${kpi("Inadimplentes",String(n.nInad),"clientes")}${kpi("Lucro do período",money(n.jurosTot-n.desp),"juros recebidos − despesas",n.jurosTot-n.desp<0?"bad":"")}</div>
  ${porRota.length?painel("Por rota",P.nome,tabela(["Rota","#Vendas","#Meta","#Recebido","#Meta","#Despesas","#Resultado","#A receber","#Em atraso"],porRota.map(r=>{const x=r.x;return `<tr class="click" data-act="tab" data-k="relRota" data-v="${esc(r.k)}"><td><b>${esc(r.n)}</b></td><td class="num">${money(x.vendas)}</td><td class="num">${celPct(x.vendas,x.metaV)}</td><td class="num">${money(x.recebido)}</td><td class="num">${celPct(x.recebido,x.metaR)}</td><td class="num">${money(x.desp)}</td><td class="num"><b>${money(x.entradas-x.saidas)}</b></td><td class="num">${money(x.aReceber)}</td><td class="num" style="color:var(${x.atraso?"--bad":"--fg"})">${money(x.atraso)}</td></tr>`}),"")):""}
  ${painel("Vendas do período",money(n.vendas),tabela(["Data","Cliente","Rota","Responsável","Modalidade","#Taxa","#Valor"],n.novos.map(c=>`<tr class="click" data-act="verContrato" data-id="${c.id}"><td>${fdate(c.dataContrato)}</td><td>${esc(cli(c.clienteId).nome)}</td><td>${esc(rotaDoc(c)||"—")}</td><td>${esc(nomeResp(respDe(c),c))}</td><td>${esc(MOD[c.modalidade]||"—")}</td><td class="num">${(+c.taxa).toLocaleString("pt-BR",{maximumFractionDigits:2})}%</td><td class="num">${money(c.valor)}</td></tr>`),"Nenhum contrato novo neste período."))}
  ${painel("Pagamentos recebidos",money(n.recebido),tabela(["Data","Cliente","Rota","Tipo","Forma","#Valor"],n.rec.map(x=>`<tr><td>${fdate(x.data)}</td><td>${esc(cli(x.clienteId).nome)}</td><td>${esc(rotaDoc(x)||"—")}</td><td>${esc((x.categoria||"").replace("Pagamento de ","").replace("Recebimento de ",""))}</td><td>${esc(x.forma||"—")}</td><td class="num" style="color:var(--ok)">${money(x.valor)}</td></tr>`),"Nenhum pagamento neste período."))}
  ${painel("Despesas e outros lançamentos",money(n.desp)+" em despesas",tabela(["Data","Descrição","Categoria","Rota","#Valor"],n.outros.map(x=>`<tr><td>${fdate(x.data)}</td><td>${esc(x.descricao)}</td><td>${esc(x.categoria||"—")}</td><td>${esc(rotaDoc(x)||"—")}</td><td class="num" style="color:var(${x.tipo==="entrada"?"--ok":"--bad"})">${x.tipo==="entrada"?"+":"−"} ${money(x.valor)}</td></tr>`),"Nenhuma despesa neste período."))}`;
};
RELV.fechamento=(R,P,abas)=>{
  const tx=S.transacoes.filter(x=>noPer(x.data,P)&&daRota(x,R)),ant=saldoAte(R,addDays(P.de,-1)),e=somaTipo(tx,"entrada"),s=somaTipo(tx,"saida");

  const cats=t=>agrupa(tx.filter(x=>x.tipo===t),x=>x.categoria||(t==="entrada"?"Outras entradas":"Outras saídas")).sort((a,b)=>(b.e+b.s)-(a.e+a.s));

  const formas=agrupa(tx,x=>x.forma).sort((a,b)=>(b.e+b.s)-(a.e+a.s));
  const dias=agrupa(tx,x=>x.data).sort((a,b)=>a.k.localeCompare(b.k));let acc=ant;
  const porRota=R==="todas"?rotasComDados(abas,k=>S.transacoes.some(x=>daRota(x,k))).map(k=>{const q=tx.filter(x=>daRota(x,k)),a=saldoAte(k,addDays(P.de,-1)),ee=somaTipo(q,"entrada"),ss=somaTipo(q,"saida");return `<tr><td><b>${esc(abas[k])}</b></td><td class="num">${money(a)}</td><td class="num" style="color:var(--ok)">${money(ee)}</td><td class="num" style="color:var(--bad)">${money(ss)}</td><td class="num"><b>${money(ee-ss)}</b></td><td class="num">${money(a+ee-ss)}</td></tr>`}):[];
  return `<div class="kpis">${kpi("Saldo anterior",money(ant),"em "+fdate(addDays(P.de,-1)))}${kpi("Entradas",money(e),tx.filter(x=>x.tipo==="entrada").length+" lançamentos")}${kpi("Saídas",money(s),tx.filter(x=>x.tipo==="saida").length+" lançamentos")}${kpi("Saldo final",money(ant+e-s),"em "+fdate(P.ate)+" · resultado "+money(e-s),ant+e-s<0?"bad":"")}</div>

  ${porRota.length?painel("Fechamento por rota",P.nome,tabela(["Rota","#Saldo anterior","#Entradas","#Saídas","#Resultado","#Saldo final"],porRota,"")):""}
  ${painel("Por forma de pagamento",P.nome,tabela(["Forma","#Lançamentos","#Entradas","#Saídas","#Resultado"],formas.map(f=>`<tr><td>${esc(f.k)}</td><td class="num">${f.n}</td><td class="num" style="color:var(--ok)">${money(f.e)}</td><td class="num" style="color:var(--bad)">${money(f.s)}</td><td class="num"><b>${money(f.e-f.s)}</b></td></tr>`),"Nada no período."))}
  ${painel("Movimento por dia","só os dias com lançamento",tabela(["Dia","#Lançamentos","#Entradas","#Saídas","#Resultado do dia","#Saldo acumulado"],dias.map(d=>{acc=r2(acc+d.e-d.s);return `<tr><td>${fdate(d.k)}</td><td class="num">${d.n}</td><td class="num" style="color:var(--ok)">${money(d.e)}</td><td class="num" style="color:var(--bad)">${money(d.s)}</td><td class="num">${money(d.e-d.s)}</td><td class="num"><b>${money(acc)}</b></td></tr>`}),"Nada no período."))}`;
};
RELV.metas=(R,P,abas)=>{
  const fator=fatorMeses(P),emAndamento=today()>=P.de&&today()<P.ate;
  const pctF=(v,m)=>m?`${celPct(v,m)}<div class="muted" style="font-size:12px">${v>=m?"meta batida":"falta "+money(m-v)}</div>`:'<span class="muted">—</span>';
  const linhaMeta=(nome,mv,v,mr,r,extra="",act="")=>`<tr${act}><td><b>${esc(nome)}</b>${extra}</td><td class="num">${money(v)}</td><td class="num">${mv?money(mv):'<span class="muted">—</span>'}</td><td class="num">${pctF(v,mv)}</td><td class="num">${money(r)}</td><td class="num">${mr?money(mr):'<span class="muted">—</span>'}</td><td class="num">${pctF(r,mr)}</td>${emAndamento?`<td class="num">${mv||mr?[mv?pct(projecao(v,P),mv)+"% vendas":"",mr?pct(projecao(r,P),mr)+"% receb.":""].filter(Boolean).join("<br>"):"—"}</td>`:""}</tr>`;
  const cab=["Quem","#Vendido","#Meta","#Atingido","#Recebido","#Meta","#Atingido",...(emAndamento?["#Projeção"]:[])];
  const rotasL=(R==="todas"?rotas():R==="sem rota"?[]:[R]);
  const linhasRota=rotasL.map(k=>{const x=numsRel(k,P);return linhaMeta(k,x.metaV,x.vendas,x.metaR,x.recebido,"",` class="click" data-act="tab" data-k="relRota" data-v="${esc(k)}"`)});
  const totR=R==="todas"?numsRel("todas",P):null;
  // por operador: vendas dos contratos que ele lançou; recebido dos pagamentos desses contratos
  const cons=S.contratos.filter(c=>!c.cancelado&&!c.pendente&&daRota(c,R)),rec=S.transacoes.filter(x=>x.tipo==="entrada"&&x.contratoId&&noPer(x.data,P)&&daRota(x,R));
  const ids=new Set([...usuariosL().filter(u=>u.ativo&&(u.papel==="operador"||u.meta_vendas||u.meta_receb)&&(R==="todas"||u.rota===R)).map(u=>String(u.id)),...cons.filter(c=>noPer(c.dataContrato,P)).map(respDe),...rec.map(x=>{const k=conId(x.contratoId);return k?respDe(k):""})]);

  <p class="muted" style="margin:0">Metas de rota: Configurações → Metas mensais por rota. Metas de cada operador: Usuários → Editar. Contratos antigos, de antes do registro de quem lançou, contam para o operador da rota quando a rota tem um operador só.</p>`;

RELV.carteira=(R,P,abas)=>{

  const cons=S.contratos.filter(c=>daRota(c,R)),sit=Object.entries(STP).map(([k,[n]])=>{const l=cons.filter(c=>statusC(c)===k);return {n,c:l.length,v:k==="cancelado"?0:soma(l.filter(c=>!c.pendente),saldoContrato)}}).filter(x=>x.c);

function verCliente(id){
  const c=S.clientes.find(x=>x.id===id);if(!c)return;

  openDrawer(`<div class="hd"><div><h2>${esc(c.nome)}${ex(c)}</h2><div class="muted">${c.status==="pre"?"Pré-cadastro":c.status==="bloqueado"?"Bloqueado":"Cliente ativo"}</div></div><button data-act="close" aria-label="Fechar">Fechar</button></div>
  ${c.foto?`<div class="panel"><div class="body" style="display:flex;gap:14px;align-items:center"><a href="/api/foto/${encodeURIComponent(id)}" target="_blank" rel="noopener"><img src="/api/foto/${encodeURIComponent(id)}" alt="Foto de ${esc(c.nome)}" style="width:120px;height:160px;object-fit:cover;border-radius:10px;border:1px solid var(--line)"></a><div class="muted">Foto tirada com a câmera no pré-cadastro${c.fotoEm?`<br>em ${fdate(c.fotoEm.slice(0,10))} às ${new Date(c.fotoEm).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`:""}<br><span style="font-size:12px">Clique na foto para ampliar.</span></div></div></div>`:""}
  <div class="panel"><div class="body dl">${[["CPF",c.cpf],["RG",c.rg],["Telefone",c.telefone],["E-mail",c.email],["Endereço",c.endereco],["Indicação",c.indicacao],["Profissão",c.profissao],["Empresa",c.empresa],["Endereço do trabalho",c.enderecoTrabalho],["Tempo de carteira",c.tempoRegistro],["Renda mensal",c.renda?money(c.renda):""],["Rota",c.rota],["Origem",c.origem==="link"?"Link de pré-cadastro"+(c.franquia?" · "+c.franquia:""):"Cadastro manual"],["Lembretes no WhatsApp",c.semLembrete?"Não quer receber":"Recebe"],["Cadastrado em",fdate((c.criadoEm||"").slice(0,10))]].map(([k,v])=>`<div><span>${k}</span><b>${esc(v||"—")}</b></div>`).join("")}${c.referencias?`<div style="grid-column:1/-1;white-space:pre-line"><span>Contatos de referência</span>${esc(c.referencias)}</div>`:""}${c.obs?`<div style="grid-column:1/-1"><span>Observações</span>${esc(c.obs)}</div>`:""}</div></div>
  <div class="row"><button data-act="editCliente" data-id="${id}">Editar dados</button>${c.status!=="pre"?`<button class="pri" data-act="novoContrato" data-cli="${id}">Novo contrato</button>`:`<button class="pri" data-act="aprovar" data-id="${id}">Aprovar cadastro</button>`}<button data-act="bloquear" data-id="${id}">${c.status==="bloqueado"?"Desbloquear":"Bloquear"}</button><button class="danger" data-act="delCliente" data-id="${id}">Excluir</button></div>
  <section class="panel"><header><h2>Contratos</h2></header>${conRows(cs)}</section>
  ${histCliente(cs)}`);
}
// histórico de pagamentos do cliente, com o total de capital e de juros (por contrato e no geral)
function histCliente(cs){
  const ok=cs.filter(k=>!k.pendente),rs=ok.map(k=>({k,...resumoPags(k)})),todos=rs.flatMap(r=>r.ps.map(x=>({...x,k:r.k}))).sort((a,b)=>b.data.localeCompare(a.data));
  if(!todos.length)return `<section class="panel"><header><h2>Pagamentos</h2></header><div class="body muted">Nenhum pagamento ainda.</div></section>`;
  const T=k=>money(r2(rs.reduce((a,r)=>a+r[k],0)));

  <div class="body dl">${[["Total pago",T("pago")],["Capital pago",T("capital")],["Juros pagos",T("juros")],["Capital em aberto",money(r2(rs.filter(r=>!r.k.cancelado).reduce((a,r)=>a+r.capAberto,0)))]].map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join("")}</div>

  <section class="panel"><header><h2>Cronograma de transações</h2><span class="muted">juros = saldo × ${tx}% ÷ 30 × dias</span></header><div class="tbl"><table><thead><tr><th>#</th><th>Data</th><th class="num">Dias</th><th class="num">Juros do período</th><th class="num">Valor</th><th class="num">Saldo devedor</th><th></th></tr></thead><tbody>${linhas}${hoje}</tbody></table></div></section>

function verContrato(id){

  const cl=cli(c.clienteId),ps=c.parcelas||[];
  const totalC=r2(ps.reduce((a,p)=>a+p.valor,0)),pago=r2(ps.reduce((a,p)=>a+pagoP(p),0)),rp=resumoPags(c);
  openDrawer(`<div class="hd"><div><h2>Contrato de ${esc(cl.nome)}${ex(c)}</h2><div class="row" style="margin-top:4px">${pillC(c)}<span class="muted">${MOD[c.modalidade]} · ${PER[c.periodicidade]}</span></div></div><button data-act="close">Fechar</button></div>
  ${bannerPend(c)}${bannerInad(c)}<div class="panel"><div class="body dl">${[["Valor emprestado",money(c.valor)],["Taxa",(+c.taxa).toLocaleString("pt-BR")+"% ao período"],["Total do contrato",money(totalC)],["Lucro previsto",money(totalC-c.valor)],["Já recebido",money(pago)],["Capital recebido",money(rp.capital)],["Juros recebidos",money(rp.juros)],["Capital em aberto",money(rp.capAberto)],["Saldo em aberto",money(saldoContrato(c))],["Data do contrato",fdate(c.dataContrato)],["Multa / mora",`${esc(c.multa)}% + ${esc(c.mora)}%/dia`]].map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join("")}${c.obs?`<div style="grid-column:1/-1"><span>Observações</span>${esc(c.obs)}</div>`:""}</div></div>
  <section class="panel"><header><h2>Parcelas</h2><span class="muted" style="font-size:12.5px">Em cinza, a previsão: capital pela tabela do contrato e juros no resto da parcela. Depois do pagamento, aparece o que foi lançado.</span></header><div class="tbl"><table><thead><tr><th>#</th><th>Vencimento</th><th class="num">Valor</th><th class="num">Capital</th><th class="num">Juros</th><th class="num">Pago</th><th>Situação</th><th></th></tr></thead><tbody>${ps.map(p=>{const e=encargos(p,c);const st=quitadaP(p)?((p.pagamentos||[]).some(g=>g.repasse)?`<span class="pill warn">Paga a menor</span><div class="muted" style="font-size:12px;margin-top:2px">${fdate((p.pagamentos.at(-1)||{}).data)}</div>`:`<span class="pill ok">Paga ${fdate((p.pagamentos.at(-1)||{}).data)}</span>`):e.atraso?`<span class="pill bad">${e.atraso} dias</span>`:e.pago>0?'<span class="pill warn">Parcial</span>':'<span class="pill">Aberta</span>';
    const nota=t=>`<div class="muted" style="font-family:var(--f-body);font-size:12px;line-height:1.35;white-space:normal;min-width:150px;max-width:200px;margin-left:auto;margin-top:2px">${t}</div>`;
    const acr=(p.acrescimos||[]).map(a=>nota(`${a.valor?`+ ${money(a.valor)} da parcela ${a.de}`:""}${a.valor&&a.juros?" ":""}${a.juros?`+ ${money(a.juros)} de juros`:""}`)).join("");
    const rep=(p.pagamentos||[]).filter(g=>g.repasse||g.motivo).map(g=>nota(`${g.repasse?`faltou ${money(g.repasse.valor)} → parcela ${g.repasse.para}`:"pago a menor"}${g.motivo?" · motivo: "+esc(g.motivo):""}`)).join("");
    // capital e juros: o que foi lançado nos pagamentos; parcela sem pagamento mostra a divisão prevista (proporção do contrato), em cinza
    const dv=(p.pagamentos||[]).map(g=>divPag(c,p,g)),jPrev=r2((+p.valor||0)-capPrev(c,p));
    const capJur=dv.length?`<td class="num">${money(r2(dv.reduce((a,x)=>a+x.capital,0)))}</td><td class="num">${money(r2(dv.reduce((a,x)=>a+x.juros,0)))}</td>`
      :`<td class="num muted" title="Previsto">${money(r2(p.valor-jPrev))}</td><td class="num muted" title="Previsto">${money(jPrev)}</td>`;
    const enc=!quitadaP(p)&&e.multa+e.mora>0?nota(`+ ${money(r2(e.multa+e.mora))} de multa e mora`):"";
    return `<tr><td>${p.n}</td><td>${fdate(p.venc)}</td><td class="num">${money(p.valor)}${acr}${enc}</td>${capJur}<td class="num">${money(e.pago)}${rep}</td><td>${st}</td><td><div class="row">${!quitadaP(p)&&!c.cancelado?`<button class="sm pri" data-act="pagar" data-id="${c.id}" data-n="${p.n}">Receber</button><button class="sm" data-act="cobrar" data-id="${c.id}" data-n="${p.n}">Cobrar</button>`:""}${(p.pagamentos||[]).length?`<button class="sm" data-act="estornar" data-id="${c.id}" data-n="${p.n}">Estornar</button>`:""}</div></td></tr>`}).join("")}</tbody></table></div></section>
  <div class="row">${!c.cancelado&&statusC(c)!=="quitado"?`${btnInad(c)}<button data-act="cancelarC" data-id="${id}">Cancelar contrato</button>`:""}<button class="danger" data-act="delContrato" data-id="${id}">Excluir contrato</button><button data-act="verCliente" data-id="${c.clienteId}">Ver cliente</button></div>`);
}

// Campos obrigatórios do cliente (os mesmos do formulário público). Só e-mail, indicação e observações são livres.
function cpfOk(s){const c=String(s||"").replace(/\D/g,"");if(!/^\d{11}$/.test(c)||/^(\d)\1{10}$/.test(c))return false;
  const dv=n=>{let t=0;for(let i=0;i<n;i++)t+=+c[i]*(n+1-i);const r=t*10%11;return r===10?0:r};return dv(9)===+c[9]&&dv(10)===+c[10]}
const OBRIG_CLI=[["nome",v=>v.trim().length>=5&&v.trim().includes(" "),"nome completo"],["cpf",cpfOk,"CPF válido"],
  ["rg",v=>v.replace(/[^0-9A-Za-z]/g,"").length>=5,"RG"],["telefone",v=>v.replace(/\D/g,"").length>=10,"telefone com DDD"],
  ["endereco",v=>v.trim().length>=8,"endereço residencial"],["profissao",v=>!!v.trim(),"profissão"],["empresa",v=>!!v.trim(),"nome da empresa"],
  ["enderecoTrabalho",v=>v.trim().length>=8,"endereço do local de trabalho"],["tempoRegistro",v=>!!v.trim(),"tempo de carteira"],
  ["renda",v=>+v>0,"renda mensal"],["referencias",v=>v.split("\n").filter(l=>l.trim()).length>=2,"duas referências (uma por linha)"]];
// Marca em vermelho o que falta, mostra o alerta no topo do formulário e põe o cursor no primeiro campo. true = tudo certo.
function confereObrig(f,lista){
  const faltam=lista.filter(([n,ok])=>{const el=f.elements[n],bad=!ok(String(el.value||""));el.classList.toggle("falta",bad);return bad});
  let box=f.querySelector(".alerta-form");
  if(!faltam.length){box&&box.remove();return true}
  if(!box){box=document.createElement("div");box.className="alerta-form full";box.setAttribute("role","alert");f.prepend(box)}
  box.textContent="Preencha os campos obrigatórios: "+faltam.map(x=>x[2]).join(", ")+".";
  f.elements[faltam[0][0]].focus();toast("Faltam campos obrigatórios.");
  return false;
}

  const f=$("#fCon"),F=n=>f.elements[n];

    if(pj>0){m.txJ=uid("tx");caixa.push({op:"gravar",col:"transacoes",id:m.txJ,dados:{...base,valor:pj,categoria:"Pagamento de juros",descricao:"Juros · "+nome}})}
    if(pc>0){m.txC=uid("tx");caixa.push({op:"gravar",col:"transacoes",id:m.txC,dados:{...base,valor:pc,categoria:"Pagamento de capital",descricao:"Capital · "+nome}})}
    if(d.novoVenc&&d.novoVenc!==c.vencimento&&dep>0.009){m.vencAnterior=c.vencimento;mud.vencimento=d.novoVenc;mud.renegociacoes=[...(c.renegociacoes||[]),{data:d.data,de:c.vencimento,para:d.novoVenc,motivo:"Pagamento de "+money(v),movId:m.id}]}
    try{await gravaJuntos([{op:"mesclar",col:"contratos",id:cid,dados:{...mud,movimentos:[...(c.movimentos||[]),m]}},...caixa]);
      closeTop();toast(dep<=0.009?"Contrato quitado":"Pagamento registrado");if($(".drawer"))setTimeout(()=>verContrato(cid),300)}catch(_){}};
}
function estornarSaldo(cid){
  const c=S.contratos.find(x=>x.id===cid),last=c&&extrato(c).linhas.at(-1).mov;if(!last)return;
  confirmar(`Estornar o pagamento de ${money(last.valor)} feito em ${fdate(last.data)}?`,async()=>{
    const c2=S.contratos.find(x=>x.id===cid),ult=c2&&extrato(c2).linhas.at(-1).mov; // o contrato como está agora
    if(!ult||ult.id!==last.id){toast("O contrato mudou. Abra de novo e confira.");return}
    const r=(c2.renegociacoes||[]).find(x=>x.movId===last.id),data={movimentos:(c2.movimentos||[]).filter(m=>m.id!==last.id)};
    if(r){data.renegociacoes=c2.renegociacoes.filter(x=>x!==r);if(c2.vencimento===r.para)data.vencimento=r.de}
    try{await gravaJuntos([{op:"mesclar",col:"contratos",id:cid,dados:data},...[last.txJ,last.txC].filter(Boolean).map(t=>({op:"excluir",col:"transacoes",id:t}))]);
      toast("Pagamento estornado");setTimeout(()=>verContrato(cid),300)}catch(_){}
  },"Estornar");
}
function formMarcarInad(cid){
  const c=S.contratos.find(x=>x.id===cid);if(!c)return;
  openModal(`<h3>Marcar como inadimplente</h3><div class="muted">O contrato entra na tela de Inadimplentes mesmo antes do corte de dias. O motivo aparece para o cobrador.</div>
  <form id="fInad" class="form"><label class="f full">Motivo<textarea name="motivo" required placeholder="Ex.: não atende o telefone desde o vencimento" style="min-height:60px"></textarea></label>
  <div class="row end full"><button type="button" data-act="close">Cancelar</button><button class="pri" type="submit">Marcar</button></div></form>`);
  $("#fInad").onsubmit=async e=>{e.preventDefault();const m=formData(e.target).motivo.trim();if(!m)return;
    try{await upd("contratos",cid,{inad:{motivo:m,em:today()}});closeTop();toast("Contrato marcado como inadimplente");setTimeout(()=>verContrato(cid),300)}catch(_){}};
}
function formRenegociar(cid){
  const c=S.contratos.find(x=>x.id===cid);if(!c)return;
  openModal(`<h3>Renegociar vencimento</h3><div class="muted">Vencimento atual: ${fdate(c.vencimento)}. Os juros continuam correndo por dia até o pagamento.</div>
  <form id="fRen" class="form"><label class="f">Novo vencimento<input name="para" type="date" required value="${addMonths(c.vencimento<today()?today():c.vencimento,1)}"></label>
  <label class="f">Motivo<input name="motivo" placeholder="Ex.: pediu mais prazo"></label>
  <div class="row end full"><button type="button" data-act="close">Cancelar</button><button class="pri" type="submit">Salvar</button></div></form>`);
  $("#fRen").onsubmit=async e=>{e.preventDefault();const d=formData(e.target),c2=S.contratos.find(x=>x.id===cid)||c; // o contrato como está agora
    if(d.para===c2.vencimento){closeTop();return}
    try{await upd("contratos",cid,{vencimento:d.para,renegociacoes:[...(c2.renegociacoes||[]),{data:today(),de:c2.vencimento,para:d.para,motivo:d.motivo||""}]});closeTop();toast("Vencimento alterado");setTimeout(()=>verContrato(cid),300)}catch(_){}};
}
function estornar(cid,n){
  const c=S.contratos.find(x=>x.id===cid),p=c&&c.parcelas.find(x=>x.n===n);if(!p||!(p.pagamentos||[]).length)return;
  const last=p.pagamentos.at(-1);
  confirmar(`Estornar o pagamento de ${money(last.valor)} feito em ${fdate(last.data)}?`,async()=>{
    const c2=S.contratos.find(x=>x.id===cid),p2=c2&&c2.parcelas.find(x=>x.n===n),ult=p2&&(p2.pagamentos||[]).at(-1); // o contrato como está agora
    if(!ult||ult.txId!==last.txId||ult.valor!==last.valor||ult.data!==last.data){toast("O contrato mudou. Abra de novo e confira.");return}
    // pagamento a menor: devolve o que foi somado na outra parcela (ou nesta, quando ficou os juros aqui)
    const rp=ult.repasse,alvo=rp&&c2.parcelas.find(x=>x.n===rp.para);
    if(rp&&(!alvo||(alvo.pagamentos||[]).length)){toast(`Estorne antes os pagamentos da parcela ${rp.para}: ela recebeu o que faltou desta.`);return}
    const tira=x=>{const a=(x.acrescimos||[]).find(y=>y.txId===ult.txId);return a?{...x,valor:r2(x.valor-a.valor-a.juros),acrescimos:x.acrescimos.filter(y=>y!==a)}:x};
    const parcelas=c2.parcelas.map(x=>x.n===n?tira({...x,valor:r2(x.valor+(rp?.reduz||0)),pagamentos:x.pagamentos.slice(0,-1),quitada:false}):rp&&x.n===rp.para?tira(x):x);
    try{await gravaJuntos([{op:"mesclar",col:"contratos",id:cid,dados:{parcelas}},...(last.txId?[{op:"excluir",col:"transacoes",id:last.txId}]:[])]);
      toast("Pagamento estornado");setTimeout(()=>verContrato(cid),300)}catch(_){}
  },"Estornar");
}
function mensagem(cid,n){
  const c=S.contratos.find(x=>x.id===cid);if(!c)return;
  let k;
  if(isSaldo(c))k={parc:"única",valor:extrato(c).saldoHoje,venc:c.vencimento,atraso:Math.max(0,days(c.vencimento,today()))};
  else{const p=c.parcelas.find(x=>x.n===n);if(!p)return;const e=encargos(p,c);k={parc:`${p.n}/${c.parcelas.length}`,valor:e.devido,venc:p.venc,atraso:e.atraso}}
  const cl=cli(c.clienteId);
  const txt=cfg("msg").replace(/\{nome\}/g,(cl.nome||"").split(" ")[0]).replace(/\{parcela\}/g,k.parc).replace(/\{valor\}/g,money(k.valor)).replace(/\{vencimento\}/g,fdate(k.venc)).replace(/\{atraso\}/g,k.atraso+" dias");
  const tel=String(cl.telefone||"").replace(/\D/g,""),full=tel.length>=10&&tel.length<=11?"55"+tel:tel;
  openModal(`<h3>Mensagem de cobrança</h3><div class="muted">${esc(cl.nome)} · ${esc(cl.telefone||"sem telefone")}</div><div class="msgbox" id="msgTxt">${esc(txt)}</div>
  <div class="row end"><button data-act="close">Fechar</button><button id="cpMsg">Copiar texto</button>${full?`<a class="btn pri" target="_blank" rel="noopener" href="https://wa.me/${full}?text=${encodeURIComponent(txt)}">Abrir no WhatsApp</a>`:""}</div>`);
  $("#cpMsg").onclick=()=>{navigator.clipboard?.writeText(txt).then(()=>toast("Mensagem copiada"),()=>{const r=document.createRange();r.selectNodeContents($("#msgTxt"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Texto selecionado: use Ctrl+C")})};
}
function formLanc(){
  openModal(`<h3>Novo lançamento no caixa</h3><form id="fLan" class="form">
  <label class="f">Tipo<select name="tipo"><option value="saida">Saída (despesa, retirada)</option><option value="entrada">Entrada (aporte, outra receita)</option></select></label>
  <label class="f">Valor (R$)<input name="valor" type="number" step="0.01" min="0.01" required></label>
  <label class="f full">Descrição<input name="descricao" required placeholder="Ex.: combustível para cobranças"></label>
  <label class="f">Categoria<input name="categoria" list="cats" placeholder="Despesa operacional"><datalist id="cats"><option>Despesa operacional</option><option>Aporte de capital</option><option>Retirada do sócio</option><option>Comissão</option></datalist></label>
  <label class="f">Data<input name="data" type="date" required value="${today()}"></label>
  <label class="f">Forma<select name="forma"><option>Pix</option><option>Dinheiro</option><option>Transferência</option></select></label>
  <label class="f">Rota<select name="rota"><option value="">Sem rota (geral)</option>${rotas().map(r=>`<option ${ui.cxRota===r?"selected":""}>${esc(r)}</option>`).join("")}</select></label>
  <div class="row end full"><button type="button" data-act="close">Cancelar</button><button class="pri" type="submit">Lançar</button></div></form>`);
  $("#fLan").onsubmit=async e=>{e.preventDefault();const d=formData(e.target);try{await put("transacoes",{...d,id:uid("tx"),valor:+d.valor,criadoEm:new Date().toISOString()});closeTop();toast("Lançamento registrado")}catch(_){}};
}

/* ---------- eventos ---------- */
document.addEventListener("click",async e=>{
  const sc=e.target.closest(".scrim");if(sc&&e.target===sc){closeTop();return}
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act,id=a.dataset.id,n=+a.dataset.n;
  if(a.tagName==="TR"&&e.target.closest("button"))return;
  e.stopPropagation();
  switch(act){
    case"close":closeTop();break;
    case"tab":ui[a.dataset.k]=a.dataset.v;ui.cliMax=ui.conMax=LOTE_LINHAS;render();break;
    case"mais":ui[a.dataset.k]+=LOTE_LINHAS;render();break;
    case"go":if(a.dataset.tab)ui.cobTab=a.dataset.tab;location.hash=a.dataset.go;break;
    case"novoCliente":formCliente(null,!!a.dataset.pre);break;
    case"editCliente":formCliente(S.clientes.find(x=>x.id===id));break;
    case"verCliente":verCliente(id);break;
    case"verContrato":verContrato(id);break;
    case"novoContrato":formContrato(a.dataset.cli);break;
    case"pagar":{const c=S.contratos.find(x=>x.id===id);
      if(!podeReceber()){toast("Só o administrador dá baixa em pagamentos.");break}
      if(c&&c.pendente){toast("Este contrato ainda aguarda a confirmação do Pix.");break}
      isSaldo(c)?formPagarSaldo(id):formPagar(id,n);break}
    case"confirmarPix":formConfirmarPix(id);break;
    case"cobrar":mensagem(id,n);break;
    case"avisar":{const x=lembretesHoje().find(y=>y.id===id);if(x&&!x.aviso)put("avisos",{id,quando:new Date().toISOString(),por:window.__ccUsuario||"",contratoId:x.c.id,clienteId:x.c.clienteId,venc:x.p.venc,falta:x.falta}).catch(()=>{});break} // o link abre o WhatsApp normalmente
    case"estornar":estornar(id,n);break;
    case"estornarSaldo":estornarSaldo(id);break;
    case"renegociar":formRenegociar(id);break;
    case"marcarInad":formMarcarInad(id);break;
    case"desmarcarInad":confirmar("Tirar este contrato da inadimplência? Ele só volta para a lista se passar do corte de dias.",async()=>{try{await upd("contratos",id,{inad:null});toast("Marcação removida");setTimeout(()=>verContrato(id),300)}catch(_){}},"Tirar");break;
    case"novoLanc":formLanc();break;
    case"pdf":window.print();break;
    case"relDoCaixa":ui.relRota=ui.cxRota;ui.relTab="fechamento";location.hash="relatorios";break;
    case"perAtalho":{const v=a.dataset.v,t=today();ui.per=v==="ano"?{tipo:"periodo",mes:ui.per.mes,de:t.slice(0,4)+"-01-01",ate:t.slice(0,4)+"-12-31"}:{...ui.per,tipo:"mes",mes:(v==="mesPassado"?addMonths(t.slice(0,7)+"-01",-1):t).slice(0,7)};render();break}
    case"aprovar":try{await upd("clientes",id,{status:"ativo"});toast("Cadastro aprovado");if($(".drawer"))verCliente(id)}catch(_){}break;
    case"recusar":confirmar("Recusar e excluir este pré-cadastro?",async()=>{try{await del("clientes",id);toast("Pré-cadastro excluído")}catch(_){}},"Recusar");break;
    case"bloquear":{const c=S.clientes.find(x=>x.id===id);try{await upd("clientes",id,{status:c.status==="bloqueado"?"ativo":"bloqueado"});setTimeout(()=>verCliente(id),300)}catch(_){}break}
    case"delCliente":if(S.contratos.some(k=>k.clienteId===id)){toast("Este cliente tem contratos. Exclua os contratos antes.");break}confirmar("Excluir este cliente?",async()=>{try{await del("clientes",id);closeTop();toast("Cliente excluído")}catch(_){}},"Excluir");break;
    case"cancelarC":confirmar("Cancelar este contrato? As parcelas em aberto deixam de ser cobradas.",async()=>{try{await upd("contratos",id,{cancelado:true});setTimeout(()=>verContrato(id),300)}catch(_){}},"Cancelar contrato");break;
    case"delContrato":confirmar("Excluir o contrato e todos os lançamentos de caixa ligados a ele?",async()=>{try{await gravaJuntos([...S.transacoes.filter(x=>x.contratoId===id).map(t=>({op:"excluir",col:"transacoes",id:t.id})),{op:"excluir",col:"contratos",id}]);closeTop();toast("Contrato excluído")}catch(_){}},"Excluir");break;
    case"delLanc":confirmar("Excluir este lançamento?",async()=>{try{await del("transacoes",id);toast("Lançamento excluído")}catch(_){}},"Excluir");break;
    case"limparEx":confirmar("Remover todos os dados de exemplo?",async()=>{try{for(const col of ["transacoes","contratos","clientes"])for(const x of S[col].filter(x=>x.exemplo))await del(col,x.id);toast("Dados de exemplo removidos")}catch(_){}},"Remover");break;
  }
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".kpi[data-act]")){e.preventDefault();e.target.click()}});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="cliQ"||t.id==="conQ"){ui[t.id]=t.value;ui.cliMax=ui.conMax=LOTE_LINHAS;focusId=t.id;focusPos=t.selectionStart;render();}
  // período do caixa e dos relatórios
  if(t.id==="perMes"&&t.value){ui.per.mes=t.value;render()}
  if(t.id==="perTipo"){if(t.value==="periodo"&&!(ui.per.de&&ui.per.ate)){const P=periodo();ui.per.de=P.de;ui.per.ate=P.ate}ui.per.tipo=t.value;render()}
  if((t.id==="perDe"||t.id==="perAte")&&t.value){ui.per[t.id==="perDe"?"de":"ate"]=t.value;if(ui.per.de>ui.per.ate)toast("A data inicial passa da final: confira o período.");render()}
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="fCfg")return;e.preventDefault();const d=formData(e.target);
  try{if(!canWrite)throw 0;await db.doc("config/geral").set({nome:d.nome,taxa:+d.taxa,saldoInicial:+d.saldoInicial||0,multa:+d.multa,mora:+d.mora,corteDias:Math.max(1,parseInt(d.corteDias)||1),msg:d.msg,empresaPublica:(d.empresaPublica||"").trim(),avisoPrivacidade:(d.avisoPrivacidade||"").trim(),rotas:(d.rotas||"").split(",").map(x=>x.trim()).filter(Boolean).join(", "),operadorRecebe:d.operadorRecebe==="on",metas:lerMetas(e.target)});toast("Configurações salvas")}catch(_){toast("Não foi possível salvar.")}
});
$("#menuBtn").onclick=e=>{e.stopPropagation();$("#side").classList.toggle("open")};
document.addEventListener("click",e=>{const s=$("#side");if(s.classList.contains("open")&&!s.contains(e.target)&&!e.target.closest("#menuBtn"))s.classList.remove("open")},true); // tocar fora fecha o menu no celular
function route(){const h=location.hash.slice(1);view=TITLES[h]?h:"dashboard";if(view==="relatorios")S.usuariosPedidos=false;focusId=null;$("#side").classList.remove("open");$("#layer").innerHTML="";render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
route();boot();
