<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Entrar · CrediControle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/base.css">
</head>
<body>
<main class="page narrow">
  <div class="brand"><i>C</i>CrediControle</div>
  <div class="card">
    <h1>Entrar</h1>
    <p class="muted" style="margin-top:0">Use o e-mail e a senha que o administrador cadastrou para você.</p>
    <form id="f" class="form">
      <label class="f">E-mail<input name="email" type="email" autocomplete="username" required autofocus></label>
      <label class="f">Senha<input name="senha" type="password" autocomplete="current-password" required></label>
      <div id="erro" class="erro" hidden></div>
      <button class="pri" type="submit">Entrar</button>
      <a href="/esqueci" style="color:var(--accent);text-align:center">Esqueci minha senha</a>
    </form>
  </div>
</main>
<script>
const f = document.getElementById("f"), erro = document.getElementById("erro");
f.onsubmit = async e => {
  e.preventDefault();
  const b = f.querySelector("button"); b.disabled = true; erro.hidden = true;
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.fromEntries(new FormData(f))) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.erro || "Não foi possível entrar.");
    location.href = "/";
  } catch (x) { erro.textContent = x.message; erro.hidden = false; b.disabled = false; }
};
</script>
</body>
</html>
